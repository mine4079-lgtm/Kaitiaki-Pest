name: Use single TrapNZ-style filter controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[filters-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting filter controllers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          ids=['filter-interaction-patch','modern-filter-js','kaitiaki-final-filter-controller']
          for sid in ids:
              s=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>','',s,flags=re.S,count=1)
          s=re.sub(r'<!-- KAITIAKI INDEPENDENT MONITORING FILTERS v2 -->.*?</script>','',s,flags=re.S,count=1)
          s=s.replace('window.DATA=DATA;window.KPUpdate=update;','')
          # Keep the single external TrapNZ-style controller; remove stale marker comments only.
          s=s.replace('<!-- KAITIAKI FINAL FILTER CONTROLLER -->','')
          p.write_text(s,encoding='utf-8')
          print('Conflicting filter controllers removed')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use single TrapNZ-style filter controller [filters-clean]"
          git push
