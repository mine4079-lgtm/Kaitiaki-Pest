name: Add trap history
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          # Existing trap-history patch (only if the old version is not already present).
          if 'Kaitiaki Trap History v1' not in s:
              s=s.replace("const DATA={traps:[],monitoring:[],lines:[]};", "const DATA={traps:[],monitoring:[],lines:[],records:[]};\n/* Kaitiaki Trap History v1 */")
              s=s.replace("st.put(DATA.lines,'lines');", "st.put(DATA.lines,'lines');st.put(DATA.records,'records');")
              s=s.replace("const [traps,monitoring,lines]=await Promise.all([get('traps'),get('monitoring'),get('lines')]);", "const [traps,monitoring,lines,records]=await Promise.all([get('traps'),get('monitoring'),get('lines'),get('records')]);")
              s=s.replace("if(Array.isArray(lines))DATA.lines=lines;", "if(Array.isArray(lines))DATA.lines=lines;if(Array.isArray(records))DATA.records=records;")

          # Trap status data fields.
          oldtrap="retired:field(p,['is_retired','retired'],'0'),notes:field(p,['notes'],'')"
          newtrap="retired:field(p,['is_retired','retired'],'0'),status:field(p,['status','trap_status','trapStatus'],''),disabled:field(p,['disabled','is_disabled','isDisabled'],'0'),enabled:field(p,['enabled','is_enabled','isEnabled'],''),notes:field(p,['notes'],'')"
          if oldtrap in s:
              s=s.replace(oldtrap,newtrap,1)

          # Add Trap status group to the modern filter panel.
          marker='<div class="mfGroup" data-kind="trap">'
          status_html='''<div class="mfGroup" data-kind="status">\n  <div class="mfHead"><span>Trap status</span><button type="button">Show types</button></div>\n  <div class="mfBody" id="mfStatus"></div>\n</div>\n'''
          if 'id="mfStatus"' not in s and marker in s:
              s=s.replace(marker,status_html+marker,1)

          # Hidden selector used by the existing filter-state bridge.
          hidden='<div class="section" style="display:none"><select id="trapStatus"><option value="active">Active</option><option value="retired">Retired</option><option value="disabled">Disabled</option></select></div>'
          if 'id="trapStatus"' not in s:
              target='<div class="section" style="display:none"><b>Filter by line</b>'
              if target in s: s=s.replace(target,hidden+target,1)

          # Make rendering aware of Active/Retired/Disabled.
          oldf="function filters(){var st=window.KPFilterState||{};return{line:st.line||[],trapType:st.trap||[],monType:st.mon||[],search:$(\'search\').value.trim().toLowerCase()}}\nfunction pass(t,f,mon){var k=mon?\'monType\':\'trapType\',vals=f[k]||[];if(vals.length&&vals.indexOf(t.type)<0)return false;if(f.line&&f.line.length&&f.line.indexOf(t.line)<0)return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(\' \').toLowerCase().indexOf(f.search)>=0}"
          newf="function trapStatus(t){var st=text(field(t,['status','trap_status','trapStatus'],'' )).trim().toLowerCase();var dis=text(field(t,['disabled','is_disabled','isDisabled'],'' )).trim().toLowerCase();var en=text(field(t,['enabled','is_enabled','isEnabled'],'' )).trim().toLowerCase();if(dis==='1'||dis==='true'||dis==='yes'||en==='0'||en==='false'||en==='no'||st==='disabled'||st==='inactive'||st==='deactivated')return 'disabled';if(String(t.retired).toLowerCase()==='1'||String(t.retired).toLowerCase()==='true'||st==='retired')return 'retired';return 'active'}\nfunction filters(){var st=window.KPFilterState||{};return{line:st.line||[],trapType:st.trap||[],monType:st.mon||[],status:st.status&&st.status.length?st.status:['active'],search:$(\'search\').value.trim().toLowerCase()}}\nfunction pass(t,f,mon){var k=mon?\'monType\':\'trapType\',vals=f[k]||[];if(vals.length&&vals.indexOf(t.type)<0)return false;if(!mon&&f.status&&f.status.length&&f.status.indexOf(trapStatus(t))<0)return false;if(f.line&&f.line.length&&f.line.indexOf(t.line)<0)return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(\' \').toLowerCase().indexOf(f.search)>=0}"
          if oldf in s: s=s.replace(oldf,newf,1)

          # Replace the previous filter bridge with the working Trap.NZ-style groups.
          patch=r'''<script id="filter-interaction-patch">
          (function(){
            var st=window.KPFilterState=window.KPFilterState||{trap:[],line:[],mon:[],status:['active'],ready:{trap:false,line:false,mon:false,status:false}};
            function sel(k){return document.getElementById(k==='trap'?'trapType':k==='line'?'line':k==='mon'?'monType':'trapStatus')}
            function body(k){return document.getElementById(k==='trap'?'mfTraps':k==='line'?'mfLines':k==='mon'?'mfMons':'mfStatus')}
            function vals(k){var s=sel(k);return s?Array.prototype.slice.call(s.options).map(function(o){return o.value}).filter(Boolean):[]}
            function sync(k){var a=vals(k),old=st[k]||[];if(!st.ready[k]){st[k]=k==='status'?(a.indexOf('active')>=0?['active']:a.slice()):a.slice();st.ready[k]=true;return}var keep=old.filter(function(v){return a.indexOf(v)>=0});st[k]=keep.length?keep:a.slice()}
            function fire(k){var s=sel(k);if(!s)return;s.value=st[k].length===1?st[k][0]:'';s.dispatchEvent(new Event('change',{bubbles:true}));s.dispatchEvent(new Event('input',{bubbles:true}))}
            function build(k){var b=body(k);if(!b)return;if(k==='status'){var opts=[['active','Active'],['retired','Retired'],['disabled','Disabled']];b.innerHTML='';if(!st.ready.status){st.status=['active'];st.ready.status=true}opts.forEach(function(o){var row=document.createElement('label');row.className='mfRow';var span=document.createElement('span');span.textContent=o[1];var cb=document.createElement('input');cb.type='checkbox';cb.checked=st.status.indexOf(o[0])>=0;cb.addEventListener('change',function(){if(cb.checked){if(st.status.indexOf(o[0])<0)st.status.push(o[0])}else st.status=st.status.filter(function(v){return v!==o[0]});if(!st.status.length)st.status=['active'];render()});row.appendChild(span);row.appendChild(cb);b.appendChild(row)});return}var s=sel(k);if(!s)return;sync(k);var opts=Array.prototype.slice.call(s.options).filter(function(o){return o.value});if(k==='mon'){var seen={};opts=[['Wax tags','Wax tags'],['Camera','Camera']].map(function(x){return {value:x[0],text:x[1]}}).concat(opts.map(function(o){return {value:o.value,text:o.text}})).filter(function(o){var q=o.value.toLowerCase();if(seen[q])return false;seen[q]=1;return true})}b.innerHTML='';opts.forEach(function(o){var row=document.createElement('label');row.className='mfRow';var span=document.createElement('span');span.textContent=o.text;var cb=document.createElement('input');cb.type='checkbox';cb.checked=st[k].indexOf(o.value)>=0;cb.dataset.filterValue=o.value;cb.addEventListener('change',function(){if(cb.checked){if(st[k].indexOf(o.value)<0)st[k].push(o.value)}else st[k]=st[k].filter(function(v){return v!==o.value});fire(k);render()});row.appendChild(span);row.appendChild(cb);b.appendChild(row)})}
            window.mfBuild=function(){build('trap');build('line');build('mon');build('status')};
            document.addEventListener('click',function(e){var b=e.target.closest('.mfHead button');if(!b)return;var g=b.closest('.mfGroup');if(!g)return;e.preventDefault();g.classList.toggle('open');b.textContent=g.classList.contains('open')?'Hide types':'Show types'});
            document.addEventListener('DOMContentLoaded',function(){window.mfBuild()});
            setTimeout(function(){window.mfBuild()},300);
          })();
          </script>'''
          s,n=re.subn(r'<script id="filter-interaction-patch">.*?</script>',patch,s,count=1,flags=re.S)
          if n==0: raise SystemExit('filter bridge not found')

          # Mark the patch so this workflow is idempotent.
          if 'Kaitiaki Filter Status v1' not in s:
              s=s.replace('</body>','<!-- Kaitiaki Filter Status v1 -->\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add active retired disabled and monitoring type filters'
          git push
