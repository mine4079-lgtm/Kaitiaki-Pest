name: Fix LINZ Topographic map

on:
  push:
    paths:
      - 'topo-fix.js'
      - '.github/workflows/fix-topo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-topo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Topographic layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "type==='topo'&&k?L.tileLayer('https://basemaps.linz.govt.nz/v1/tiles/topographic/WebMercatorQuad/{z}/{x}/{y}.webp?api='+encodeURIComponent(k),{maxZoom:22,attribution:'© LINZ'}):street()"
          new = "type==='topo'&&k?L.tileLayer('https://tiles-{s}.data-cdn.linz.govt.nz/services;key='+encodeURIComponent(k)+'/tiles/v4/layer=50767/EPSG:3857/{z}/{x}/{y}.png',{subdomains:'abcd',maxZoom:20,attribution:'© Toitū Te Whenua LINZ CC BY 4.0'}):street()"
          if old not in s:
              print('Topo expression already fixed or not found; leaving index.html unchanged.')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix LINZ Topographic basemap'
          git push