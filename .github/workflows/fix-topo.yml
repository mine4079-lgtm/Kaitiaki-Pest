name: Fix LINZ Topographic map

on:
  push:
    paths:
      - 'topo-fix.js'
      - '.github/workflows/fix-topo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-topo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Topographic map capture
        shell: python
        run: |
          from pathlib import Path
          p = Path('trapnz-layer-ui.js')
          s = p.read_text(encoding='utf-8')
          marker = "window.__kpTopoInstalled=true;"
          patch = """window.__kpTopoInstalled=true;\n  // Capture the existing Leaflet map when the base layer is switched.\n  // index.html creates the map before this helper script is loaded.\n  if(!window.__kpTopoMapCapture){\n    window.__kpTopoMapCapture=true;\n    var kpOriginalRemoveLayer=L.Map.prototype.removeLayer;\n    L.Map.prototype.removeLayer=function(layer){window.__kpMap=this;return kpOriginalRemoveLayer.call(this,layer);};\n  }"""
          if 'window.__kpTopoMapCapture=true;' in s:
              print('Topographic map capture fix is already present.')
          elif marker in s:
              p.write_text(s.replace(marker, patch, 1), encoding='utf-8')
              print('Topographic map capture fix inserted.')
          else:
              raise SystemExit('Expected Topographic installer marker was not found; refusing to change the file.')

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-topo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trapnz-layer-ui.js .github/workflows/fix-topo.yml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Fix LINZ Topographic basemap switching'
          git push