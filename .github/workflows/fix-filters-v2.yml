name: Fix filters v2
on:
  push:
    paths:
      - '.github/workflows/fix-filters-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch filter controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove the previous competing filter controllers so only one owns the UI.
          ids=['filter-interaction-patch','modern-filter-js','kaitiaki-final-filter-controller']
          for ident in ids:
              s=re.sub(r'<script id="'+re.escape(ident)+r'">.*?</script>','',s,flags=re.S)
          # Remove old duplicate controller comments left by earlier patches.
          s=s.replace('<!-- Kaitiaki Filter Status v1 -->','')
          s=s.replace('<!-- KAITIAKI FINAL FILTER CONTROLLER -->','')
          final=r'''<script id="kaitiaki-filter-v2">
          (function(){
            var state=window.KPFilterState=window.KPFilterState||{};
            state.trap=Array.isArray(state.trap)?state.trap:[];
            state.line=Array.isArray(state.line)?state.line:[];
            state.mon=Array.isArray(state.mon)?state.mon:[];
            state.status=Array.isArray(state.status)&&state.status.length?state.status:['active'];
            var open={status:false,trap:false,line:false,mon:false};
            var ready=false;
            function el(id){return document.getElementById(id)}
            function select(kind){return el(kind==='status'?'trapStatus':kind==='trap'?'trapType':kind==='line'?'line':'monType')}
            function body(kind){return el(kind==='status'?'mfStatus':kind==='trap'?'mfTraps':kind==='line'?'mfLines':'mfMons')}
            function options(kind){var s=select(kind);return s?Array.prototype.slice.call(s.options).filter(function(o){return o.value}).map(function(o){return {value:o.value,text:o.text}}):[]}
            function norm(v){return String(v==null?'':v).trim().toLowerCase().replace(/[\s_-]+/g,' ')}
            function monBucket(v){
              var x=norm(v);
              if(/wax\s*tags?|wax\s*tag|waxtags?/.test(x))return 'Wax tags';
              if(/camera|trail\s*cam|camera\s*trap/.test(x))return 'Camera';
              return 'Other';
            }
            function monValues(bucket){return options('mon').filter(function(o){return bucket==='Other'?monBucket(o.value)==='Other':monBucket(o.value)===bucket}).map(function(o){return o.value})}
            function checked(kind,v){return state[kind].indexOf(v)>=0}
            function setState(kind,v,on){
              if(on){if(state[kind].indexOf(v)<0)state[kind].push(v)}
              else state[kind]=state[kind].filter(function(x){return x!==v})
            }
            function redraw(){
              var q=el('search');
              if(q)q.dispatchEvent(new Event('input',{bubbles:true}));
            }
            function row(box,label,onChange,isChecked){
              var r=document.createElement('label');r.className='mfRow';
              var sp=document.createElement('span');sp.textContent=label;
              var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!isChecked;
              cb.addEventListener('change',function(){onChange(cb.checked)});
              r.appendChild(sp);r.appendChild(cb);box.appendChild(r);
            }
            function buildStatus(){
              var b=body('status');if(!b)return;
              b.innerHTML='';
              row(b,'Show all',function(on){if(on){state.status=[];buildAll();redraw()}},state.status.length===0);
              [['active','Active'],['retired','Retired'],['disabled','Disabled']].forEach(function(x){
                row(b,x[1],function(on){setState('status',x[0],on);if(state.status.length===0)state.status=[];buildAll();redraw()},checked('status',x[0]));
              });
            }
            function buildSimple(kind){
              var b=body(kind);if(!b)return;
              var os=options(kind);
              b.innerHTML='';
              row(b,'Show all',function(on){if(on){state[kind]=[];buildAll();redraw()}},state[kind].length===0);
              os.forEach(function(o){
                row(b,o.text,function(on){setState(kind,o.value,on);buildAll();redraw()},checked(kind,o.value));
              });
              state[kind]=state[kind].filter(function(v){return os.some(function(o){return o.value===v})});
            }
            function buildMon(){
              var b=body('mon');if(!b)return;
              var os=options('mon'),groups=['Wax tags','Camera','Other'];
              b.innerHTML='';
              row(b,'Show all',function(on){if(on){state.mon=[];buildAll();redraw()}},state.mon.length===0);
              groups.forEach(function(g){
                var vals=monValues(g);
                if(!vals.length && g!=='Other')return;
                var on=vals.length>0 && vals.every(function(v){return state.mon.indexOf(v)>=0});
                row(b,g,function(next){vals.forEach(function(v){setState('mon',v,next)});buildAll();redraw()},on);
              });
              os.forEach(function(o){
                if(state.mon.indexOf(o.value)<0)return;
              });
              state.mon=state.mon.filter(function(v){return os.some(function(o){return o.value===v})});
            }
            function buildAll(){
              buildStatus();buildSimple('trap');buildSimple('line');buildMon();
            }
            window.mfBuild=function(){
              if(!ready){ready=true;}
              buildAll();
            };
            document.addEventListener('click',function(e){
              var b=e.target.closest('.mfHead button');if(!b)return;
              var g=b.closest('.mfGroup');if(!g)return;
              e.preventDefault();e.stopImmediatePropagation();
              var k=g.getAttribute('data-kind');open[k]=!open[k];g.classList.toggle('open',open[k]);b.textContent=open[k]?'Hide types':'Show types';
            },true);
            document.addEventListener('change',function(e){
              if(e.target.matches('#line,#trapType,#monType,#trapStatus'))setTimeout(buildAll,0);
            });
            function syncVisibility(){
              var a=el('showTraps'),t=el('mfTrapsToggle');
              if(a&&t){t.checked=a.checked;t.onchange=function(){a.checked=t.checked;a.dispatchEvent(new Event('input',{bubbles:true}))}}
            }
            function wait(){
              var readyNow=options('trap').length||options('line').length||options('mon').length;
              if(readyNow){buildAll();syncVisibility();return;}
              setTimeout(wait,250);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wait);else wait();
          })();
          </script>'''
          s=re.sub(r'\s*</body>', '\n'+final+'\n</body>', s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Trap.NZ style filters and monitoring categories'
          git push
