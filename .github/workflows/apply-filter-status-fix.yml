name: Apply filter status fix
on:
  push:
    paths:
      - '.github/workflows/apply-filter-status-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting filter script
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # The modern filter implementation is superseded by the Trap.NZ-style
          # filter-interaction-patch immediately before it. Leaving both causes
          # Show types and checkbox clicks to fight each other.
          s,n=re.subn(r'<script id="modern-filter-js">.*?</script>\s*', '', s, count=1, flags=re.S)
          if n:
              p.write_text(s,encoding='utf-8')
          else:
              print('modern-filter-js already removed')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove conflicting modern filter handler'
          git push
