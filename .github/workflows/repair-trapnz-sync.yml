name: Repair TrapNZ sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimise monitoring rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = "if(!pass(m,f,true))return;var mk=L.circleMarker([m.lat,m.lon],"
          new = "if(!pass(m,f,true))return;if(z<15)return;var b=map.getBounds();if(!b.contains([m.lat,m.lon]))return;var mk=L.circleMarker([m.lat,m.lon],"
          if old not in s:
              raise SystemExit('monitoring render target not found')
          s = s.replace(old, new, 1)

          old2 = "map.whenReady(async function(){await loadData();update();if(DATA.traps.length||DATA.monitoring.length||DATA.lines.length)map.fitBounds(bounds(),{padding:[50,100],animate:false});setTimeout(function(){map.invalidateSize()},250)});"
          new2 = "map.whenReady(async function(){await loadData();update();if(DATA.traps.length||DATA.monitoring.length||DATA.lines.length)map.fitBounds(bounds(),{padding:[50,100],animate:false});setTimeout(function(){map.invalidateSize()},250)});map.on('moveend',function(){if(DATA.monitoring.length)render()});"
          if old2 not in s:
              raise SystemExit('map ready target not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY
      - name: Commit optimisation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'perf: render visible monitoring only [skip ci]'
          git push
