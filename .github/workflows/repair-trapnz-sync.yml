name: Repair TrapNZ sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting filter controllers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for sid in ['filter-interaction-patch','modern-filter-js','kaitiaki-final-filter-controller']:
              s=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>','',s,flags=re.S,count=1)
          s=re.sub(r'<!-- KAITIAKI INDEPENDENT MONITORING FILTERS v2 -->.*?</script>','',s,flags=re.S,count=1)
          s=s.replace('<!-- KAITIAKI FINAL FILTER CONTROLLER -->','')
          if 'src="trapnz-layer-ui.js"' not in s:
              s=s.replace('</body>','<script src="trapnz-layer-ui.js"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Single TrapNZ-style layer controller left in place')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use single TrapNZ-style filter controller [filter-cleanup]'
          git push
