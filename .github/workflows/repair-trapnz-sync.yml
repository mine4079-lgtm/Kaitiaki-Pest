name: Repair TrapNZ sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install authoritative filter controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- KAITIAKI FINAL FILTER CONTROLLER -->'
          start=s.find('<script id="kaitiaki-final-filter-controller">')
          if start >= 0:
              end=s.find('</script>', start)
              if end >= 0:
                  end += len('</script>')
                  s=s[:start]+s[end:]
          patch='''<script id="kaitiaki-final-filter-controller">
          (function(){
            var st=window.KPFilterState=window.KPFilterState||{};
            st.trap=st.trap||[];st.line=st.line||[];st.mon=st.mon||[];st.status=st.status&&st.status.length?st.status:['active'];
            function $(id){return document.getElementById(id)}
            function opts(id){var e=$(id);return e?Array.prototype.slice.call(e.options).filter(function(o){return o.value}).map(function(o){return {value:o.value,text:o.text}}):[]}
            function redraw(){var q=$('search');if(q)q.dispatchEvent(new Event('input',{bubbles:true}))}
            function add(box,label,value,checked,change){var r=document.createElement('label');r.className='mfRow';var sp=document.createElement('span');sp.textContent=label;var c=document.createElement('input');c.type='checkbox';c.checked=checked;c.addEventListener('change',function(){change(value,c.checked)});r.appendChild(sp);r.appendChild(c);box.appendChild(r)}
            function status(){var b=$('mfStatus');if(!b)return;b.innerHTML='';[['active','Active'],['retired','Retired'],['disabled','Disabled']].forEach(function(x){add(b,x[1],x[0],st.status.indexOf(x[0])>=0,function(v,on){if(on){if(st.status.indexOf(v)<0)st.status.push(v)}else st.status=st.status.filter(function(z){return z!==v});if(!st.status.length)st.status=['active'];redraw()})})}
            function kind(k,boxId,selId){var b=$(boxId);if(!b)return;b.innerHTML='';opts(selId).forEach(function(o){add(b,o.text,o.value,st[k].indexOf(o.value)>=0,function(v,on){if(on){if(st[k].indexOf(v)<0)st[k].push(v)}else st[k]=st[k].filter(function(z){return z!==v});redraw()})})}
            function mon(){var b=$('mfMons');if(!b)return;b.innerHTML='';var a=opts('monType'),used={};[['Wax tags',['wax tag','wax tags','waxtag','waxtags']],['Camera',['camera','cameras']]].forEach(function(x){var m=a.filter(function(o){var v=o.value.toLowerCase();return x[1].some(function(q){return v===q||v.indexOf(q)>=0})});if(m.length){m.forEach(function(o){if(!used[o.value]){used[o.value]=1;add(b,x[0],o.value,st.mon.indexOf(o.value)>=0,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(z){return z!==v});redraw()})}})}else add(b,x[0],x[0],false,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(z){return z!==v});redraw()})});a.forEach(function(o){if(!used[o.value]){used[o.value]=1;add(b,o.text,o.value,st.mon.indexOf(o.value)>=0,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(z){return z!==v});redraw()})}})}
            window.mfBuild=function(){status();kind('trap','mfTraps','trapType');kind('line','mfLines','line');mon()};
            document.addEventListener('click',function(e){var b=e.target.closest('.mfHead button');if(!b)return;e.preventDefault();e.stopImmediatePropagation();var g=b.closest('.mfGroup');if(!g)return;g.classList.toggle('open');b.textContent=g.classList.contains('open')?'Hide types':'Show types'},true);
            window.mfBuild();setTimeout(window.mfBuild,500);setTimeout(window.mfBuild,1500);setTimeout(window.mfBuild,3000);
          })();
          </script>
          <!-- KAITIAKI FINAL FILTER CONTROLLER -->
          '''
          s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit filter fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: working map filters [skip ci]'
          git push
