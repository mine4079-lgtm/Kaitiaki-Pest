name: Remove conflicting filter controller

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[filter-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting filter script
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'<!-- KAITIAKI INDEPENDENT MONITORING FILTERS v2 -->.*?</script>',re.S)
          s2,n=pattern.subn('',s,count=1)
          if n:
              p.write_text(s2,encoding='utf-8')
              print('Removed conflicting controller')
          else:
              print('No conflicting controller found')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove conflicting monitoring filter controller [filter-cleanup]"
          git push
