name: Fix LINZ topo final
on:
  push:
    paths:
      - '.github/workflows/fix-linz-topo-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix LINZ topographic renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('trapnz-layer-ui.js')
          s = p.read_text()
          old = "https://basemaps.linz.govt.nz/v1/tiles/topographic/EPSG:3857/style/topographic.json"
          new = "https://basemaps.linz.govt.nz/v1/styles/topographic-v2.json"
          p.write_text(s.replace(old, new))

          p = Path('index.html')
          s = p.read_text()
          bad = "encodeURIComponent(k)',{maxZoom:15"
          good = "encodeURIComponent(k),{maxZoom:15"
          p.write_text(s.replace(bad, good))
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trapnz-layer-ui.js
          git diff --cached --quiet || git commit -m 'Fix LINZ topographic renderer URL'
          git push
