name: Fix LINZ topo final
on:
  push:
    paths:
      - '.github/workflows/fix-linz-topo-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix LINZ topographic renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('trapnz-layer-ui.js')
          s = p.read_text()
          bad_stub = """  if(window.L){
    window.maplibregl=window.maplibregl||{};
    if(!window.L.maplibreGL){
      window.L.maplibreGL=function(){return {addTo:function(){return this;},remove:function(){}};};
    }
  }
"""
          s = s.replace(bad_stub, "")
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          bad = "encodeURIComponent(k)',{maxZoom:15"
          good = "encodeURIComponent(k),{maxZoom:15"
          p.write_text(s.replace(bad, good))
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trapnz-layer-ui.js
          git diff --cached --quiet || git commit -m 'Fix LINZ topographic MapLibre loading'
          git push

# Trigger final topo repair
