name: Fix modern filter clicks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add filter interaction patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'id="filter-interaction-patch"' in s:
              print('patch already present')
              raise SystemExit(0)
          patch = r'''
<script id="filter-interaction-patch">
(function(){
  function valText(o){return (o && o.textContent || '').trim()}
  function hiddenSelect(kind){
    return kind==='line'?document.getElementById('line'):kind==='trap'?document.getElementById('trapType'):document.getElementById('monType')
  }
  function refreshGroup(kind){
    var group=document.querySelector('.mfGroup[data-kind="'+kind+'"]');
    var body=group&&group.querySelector('.mfBody'), sel=hiddenSelect(kind);
    if(!body||!sel)return;
    if(!body.children.length){
      Array.prototype.slice.call(sel.options).forEach(function(o){
        if(!o.value)return;
        var row=document.createElement('label'); row.className='mfRow';
        row.innerHTML='<span>'+String(o.text).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'</span><input type="checkbox" data-filter-value="'+String(o.value).replace(/"/g,'&quot;')+'">';
        body.appendChild(row);
      });
    }
    Array.prototype.slice.call(body.querySelectorAll('input[data-filter-value]')).forEach(function(cb){
      cb.checked=sel.value===cb.getAttribute('data-filter-value');
    });
  }
  function refreshAll(){refreshGroup('line');refreshGroup('trap');refreshGroup('mon')}
  document.addEventListener('click',function(e){
    var head=e.target.closest('.mfHead button');
    if(head){
      var g=head.closest('.mfGroup');
      if(g){g.classList.toggle('open');head.textContent=g.classList.contains('open')?'Hide types':'Show types';refreshGroup(g.getAttribute('data-kind'));}
      e.preventDefault(); return;
    }
    var cb=e.target.closest('.mfRow input[data-filter-value]');
    if(cb){
      var g=cb.closest('.mfGroup'), kind=g&&g.getAttribute('data-kind'), sel=hiddenSelect(kind);
      if(sel){sel.value=cb.checked?cb.getAttribute('data-filter-value'):''; sel.dispatchEvent(new Event('change',{bubbles:true}));}
      Array.prototype.slice.call((g&&g.querySelectorAll('input[data-filter-value]'))||[]).forEach(function(x){if(x!==cb)x.checked=false});
      e.preventDefault();
    }
  },true);
  document.addEventListener('DOMContentLoaded',function(){
    refreshAll();
    setTimeout(refreshAll,500); setTimeout(refreshAll,1500); setTimeout(refreshAll,3000); setTimeout(refreshAll,6000);
  });
  setInterval(refreshAll,5000);
})();
</script>
'''
          marker='</body>'
          if marker not in s:
              raise SystemExit('body marker not found')
          p.write_text(s.replace(marker,patch+marker,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make modern filters interactive [skip ci]'
          git push
