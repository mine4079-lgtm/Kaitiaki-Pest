name: Fix working filters

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply filter layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<div class="section legacyLayers"><b>Layers</b><label><input id="showTraps" type="checkbox" checked> Traps</label><label><input id="showMon" type="checkbox" checked> Monitoring</label><label><input id="showLines" type="checkbox" checked> Trap lines</label><label><input id="showNumbers" type="checkbox" checked> Trap numbers</label><label><input id="showLineNames" type="checkbox" checked> Line names</label><label><input id="showMonNames" type="checkbox" checked> Monitoring names</label></div>\n'''
          s=s.replace(old,'')
          start=s.index('<div class="modernFilters" id="modernFilters">')
          end=s.index('\n<div class="section" style="display:none">',start)
          new='''<div class="modernFilters" id="modernFilters">
<div class="sectionTitle">Filters</div>
<div class="mfQuick"><label class="mfRow mfLayerRow"><span>Baitstations</span><input class="mfSwitch" id="mfBait" type="checkbox"></label></div>
<div class="mfGroup" data-kind="trap"><div class="mfHead"><label class="mfLayer"><span>Traps</span><input class="mfSwitch" id="mfTrapsToggle" type="checkbox" checked></label><button type="button">Show types</button></div><div class="mfBody"><div class="mfSubTitle">Trap status</div><div id="mfStatus"></div><div class="mfSubTitle">Trap types</div><div id="mfTraps"></div></div></div>
<div class="mfGroup" data-kind="mon"><div class="mfHead"><label class="mfLayer"><span>Monitoring Sites</span><input class="mfSwitch" id="mfMonToggle" type="checkbox" checked></label><button type="button">Show types</button></div><div class="mfBody"><div class="mfSubTitle">Monitoring types</div><div id="mfMons"></div></div></div>
<div class="mfGroup" data-kind="line"><div class="mfHead"><label class="mfLayer"><span>Trap lines</span><input class="mfSwitch" id="mfLinesToggle" type="checkbox" checked></label><button type="button">Show types</button></div><div class="mfBody"><div class="mfSubTitle">Lines</div><div id="mfLines"></div></div></div>
<div class="mfQuick"><label class="mfRow"><span>Points of interest</span><input id="mfPoi" type="checkbox"></label><label class="mfRow"><span>Only sensor enabled</span><input id="mfSensor" type="checkbox"></label></div>
<div class="mfGroup" data-kind="labels"><div class="mfHead"><label class="mfLayer"><span>Labels</span><input class="mfSwitch" id="mfLabelsToggle" type="checkbox" checked></label><button type="button">Show types</button></div><div class="mfBody"><label class="mfRow"><span>Trap numbers</span><input id="mfNumbers" type="checkbox" checked></label><label class="mfRow"><span>Line names</span><input id="mfLineNames" type="checkbox" checked></label><label class="mfRow"><span>Monitoring names</span><input id="mfMonNames" type="checkbox" checked></label></div></div>
</div>'''
          s=s[:start]+new+s[end:]
          anchor='.mfQuick{border-top:1px solid #ccc;padding:2px 0}'
          extra='.mfQuick{border-top:1px solid #ccc;padding:2px 0}.mfLayer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1}.mfLayer .mfSwitch{flex:0 0 auto}.mfLayerRow{border-bottom:0}.mfSubTitle{padding:10px 16px 6px;font-size:13px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em}'
          if extra not in s:s=s.replace(anchor,extra)
          s=s.replace('.mfHead button{border:0;background:none;font-size:15px;padding:8px 0;color:#222}', '.mfHead button{border:0;background:none;font-size:15px;padding:8px 0;color:#222;white-space:nowrap}')
          oldpass="function pass(t,f,mon){var k=mon?'monType':'trapType',vals=f[k]||[];if(vals.length&&vals.indexOf(t.type)<0)return false;if(!mon&&f.status&&f.status.length&&f.status.indexOf(trapStatus(t))<0)return false;if(f.line&&f.line.length&&f.line.indexOf(t.line)<0)return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().indexOf(f.search)>=0}"
          newpass="function pass(t,f,mon){var k=mon?'monType':'trapType',vals=(f[k]||[]).map(function(v){return text(v).trim().toLowerCase()}),typ=text(t.type).trim().toLowerCase();if(vals.length&&vals.indexOf(typ)<0)return false;if(!mon&&f.status&&f.status.length&&f.status.indexOf(trapStatus(t))<0)return false;var lines=(f.line||[]).map(function(v){return text(v).trim().toLowerCase()}),tl=text(t.line).trim().toLowerCase();if(lines.length&&lines.indexOf(tl)<0)return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().indexOf(f.search)>=0}"
          if oldpass in s:s=s.replace(oldpass,newpass)
          oldbind="function bindToggle(id,legacy){var a=document.getElementById(id),b=document.getElementById(legacy);if(!a||!b)return;a.checked=b.checked;a.addEventListener('change',function(){b.checked=a.checked;b.dispatchEvent(new Event('input',{bubbles:true}))})}"
          newbind="function bindToggle(id,legacy){var a=document.getElementById(id),b=document.getElementById(legacy);if(!a||!b)return;a.checked=b.checked;a.addEventListener('change',function(){if(b.checked!==a.checked){b.checked=a.checked;b.dispatchEvent(new Event('input',{bubbles:true}))}})}"
          if oldbind in s:s=s.replace(oldbind,newbind)
          p.write_text(s)
          PY
      - name: Commit filter fix
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: Trap.NZ style map filters'
          git push
