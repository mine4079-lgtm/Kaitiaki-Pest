name: Apply filter UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the working filter controller
        run: |
          sleep 15
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<script id="modern-filter-js">')
          end=s.find('</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('modern-filter-js block not found')
          end += len('</script>')
          block=r'''<script id="modern-filter-js">
          (function(){
            var st=window.KPFilterState=window.KPFilterState||{};
            st.trap=st.trap||[];st.line=st.line||[];st.mon=st.mon||[];st.status=st.status&&st.status.length?st.status:['active'];
            function $(id){return document.getElementById(id)}
            function options(id){var e=$(id);return e?Array.prototype.slice.call(e.options).filter(function(o){return o.value}).map(function(o){return {value:o.value,text:o.text}}):[]}
            function redraw(){var q=$('search');if(q)q.dispatchEvent(new Event('input',{bubbles:true}));}
            function row(box,label,value,checked,changed){
              var r=document.createElement('label');r.className='mfRow';
              var sp=document.createElement('span');sp.textContent=label;
              var cb=document.createElement('input');cb.type='checkbox';cb.checked=checked;cb.dataset.filterValue=value;
              cb.addEventListener('change',function(){changed(value,cb.checked)});
              r.appendChild(sp);r.appendChild(cb);box.appendChild(r);
            }
            function buildStatus(){
              var b=$('mfStatus');if(!b)return;b.innerHTML='';
              [['active','Active'],['retired','Retired'],['disabled','Disabled']].forEach(function(x){
                row(b,x[1],x[0],st.status.indexOf(x[0])>=0,function(v,on){
                  if(on){if(st.status.indexOf(v)<0)st.status.push(v)}else{st.status=st.status.filter(function(z){return z!==v});if(!st.status.length)st.status=['active']}
                  redraw();
                });
              });
            }
            function build(kind,boxId,selectId){
              var b=$(boxId);if(!b)return;b.innerHTML='';
              options(selectId).forEach(function(o){
                row(b,o.text,o.value,st[kind].indexOf(o.value)>=0,function(v,on){
                  if(on){if(st[kind].indexOf(v)<0)st[kind].push(v)}else st[kind]=st[kind].filter(function(z){return z!==v});
                  redraw();
                });
              });
            }
            function buildMon(){
              var b=$('mfMons');if(!b)return;b.innerHTML='';
              var actual=options('monType'),used={};
              [['Wax tags',['wax tag','wax tags','waxtag','waxtags']],['Camera',['camera','cameras']]].forEach(function(item){
                var matches=actual.filter(function(o){var v=o.value.toLowerCase();return item[1].some(function(a){return v===a||v.indexOf(a)>=0})});
                if(matches.length){
                  matches.forEach(function(o){if(!used[o.value]){used[o.value]=1;row(b,item[0],o.value,st.mon.indexOf(o.value)>=0,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(z){return z!==v});redraw();});}});
                }else{
                  row(b,item[0],item[0],false,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(z){return z!==v});redraw();});
                }
              });
              actual.forEach(function(o){if(!used[o.value]){used[o.value]=1;row(b,o.text,o.value,st.mon.indexOf(o.value)>=0,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(z){return z!==v});redraw();});}});
            }
            window.mfBuild=function(){buildStatus();build('trap','mfTraps','trapType');build('line','mfLines','line');buildMon();};
            document.addEventListener('click',function(e){
              var b=e.target.closest('.mfHead button');if(!b)return;
              e.preventDefault();e.stopImmediatePropagation();
              var g=b.closest('.mfGroup');if(!g)return;
              g.classList.toggle('open');b.textContent=g.classList.contains('open')?'Hide types':'Show types';
            },true);
            function syncLayer(toggleId,layerId){
              var x=$(toggleId),l=$(layerId);if(!x||!l)return;
              x.onchange=function(){l.checked=x.checked;l.dispatchEvent(new Event('input',{bubbles:true}));};
            }
            syncLayer('mfTrapsToggle','showTraps');
            ['mfBait','mfPoi','mfSensor'].forEach(function(id){var x=$(id);if(x)x.onchange=redraw;});
            setTimeout(window.mfBuild,100);setTimeout(window.mfBuild,700);setTimeout(window.mfBuild,1600);setTimeout(window.mfBuild,3000);
          })();
          </script>'''
          s=s[:start]+block+s[end:]
          s=s.replace('function update(){render();populate();', 'function update(){populate();render();if(window.mfBuild)window.mfBuild();', 1)
          p.write_text(s,encoding='utf-8')
          PY
            git add index.html
            git diff --cached --quiet && exit 0
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: working Trap.NZ map filters [skip ci]'
            git push && exit 0
            sleep 3
          done
          exit 1
