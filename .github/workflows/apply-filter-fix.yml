name: Apply filter UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- KAITIAKI FILTER UI FIX v2 -->'
          if marker in s:
              print('Filter fix already present')
              raise SystemExit(0)
          patch = r'''\n<script id="kaitiaki-filter-ui-fix-v2">\n(function(){\n  var st=window.KPFilterState=window.KPFilterState||{trap:[],line:[],mon:[],status:['active'],ready:{trap:true,line:true,mon:true,status:true}};\n  st.trap=st.trap||[]; st.line=st.line||[]; st.mon=st.mon||[]; st.status=st.status&&st.status.length?st.status:['active'];\n  st.ready=st.ready||{};\n\n  function $(id){return document.getElementById(id)}\n  function vals(id){var s=$(id); return s?Array.prototype.slice.call(s.options).filter(function(o){return o.value}).map(function(o){return {value:o.value,text:o.text}}):[]}\n  function redraw(){\n    var q=$('search');\n    if(q){q.dispatchEvent(new Event('input',{bubbles:true}))}\n    else if($('showTraps')){$('showTraps').dispatchEvent(new Event('input',{bubbles:true}))}\n  }\n  function makeRow(box,label,value,checked,onchange){\n    var row=document.createElement('label'); row.className='mfRow';\n    var span=document.createElement('span'); span.textContent=label;\n    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=checked; cb.dataset.filterValue=value;\n    cb.addEventListener('change',function(){onchange(value,cb.checked)});\n    row.appendChild(span); row.appendChild(cb); box.appendChild(row);\n  }\n  function buildStatus(){\n    var b=$('mfStatus'); if(!b)return; b.innerHTML='';\n    [['active','Active'],['retired','Retired'],['disabled','Disabled']].forEach(function(x){\n      makeRow(b,x[1],x[0],st.status.indexOf(x[0])>=0,function(v,on){\n        if(on){if(st.status.indexOf(v)<0)st.status.push(v)}\n        else {st.status=st.status.filter(function(x){return x!==v}); if(!st.status.length)st.status=['active']}\n        redraw();\n      });\n    });\n  }\n  function buildKind(kind,id,selectId){\n    var b=$(id); if(!b)return; b.innerHTML='';\n    var options=vals(selectId);\n    options.forEach(function(o){\n      makeRow(b,o.text,o.value,st[kind].indexOf(o.value)>=0,function(v,on){\n        if(on){if(st[kind].indexOf(v)<0)st[kind].push(v)}\n        else st[kind]=st[kind].filter(function(x){return x!==v});\n        redraw();\n      });\n    });\n  }\n  function buildMon(){\n    var b=$('mfMons'); if(!b)return; b.innerHTML='';\n    var actual=vals('monType'), seen={};\n    [['Wax tags',['wax tag','wax tags','waxtag','waxtags']],['Camera',['camera','cameras']]].forEach(function(item){\n      var match=actual.filter(function(o){var v=o.value.toLowerCase(); return item[1].some(function(a){return v===a||v.indexOf(a)>=0})});\n      if(match.length){\n        match.forEach(function(o){if(!seen[o.value]){seen[o.value]=1; makeRow(b,item[0],o.value,st.mon.indexOf(o.value)>=0,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(x){return x!==v});redraw();});}});\n      } else {\n        makeRow(b,item[0],item[0],false,function(v,on){\n          var m=actual.filter(function(o){var z=o.value.toLowerCase(); return item[1].some(function(a){return z===a||z.indexOf(a)>=0})});\n          var target=m.length?m.map(function(o){return o.value}):[v];\n          target.forEach(function(x){if(on){if(st.mon.indexOf(x)<0)st.mon.push(x)}else st.mon=st.mon.filter(function(y){return y!==x})});\n          redraw();\n        });\n      }\n    });\n    actual.forEach(function(o){if(!seen[o.value]){seen[o.value]=1;makeRow(b,o.text,o.value,st.mon.indexOf(o.value)>=0,function(v,on){if(on){if(st.mon.indexOf(v)<0)st.mon.push(v)}else st.mon=st.mon.filter(function(x){return x!==v});redraw();});}});\n  }\n  window.mfBuild=function(){buildStatus();buildKind('trap','mfTraps','trapType');buildKind('line','mfLines','line');buildMon();};\n\n  // Stop the older duplicate Show types handlers from cancelling each other out.\n  document.addEventListener('click',function(e){\n    var b=e.target.closest('.mfHead button'); if(!b)return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    var g=b.closest('.mfGroup'); if(!g)return;\n    g.classList.toggle('open');\n    b.textContent=g.classList.contains('open')?'Hide types':'Show types';\n  },true);\n\n  function wireToggle(id,layerId){\n    var x=$(id), layer=$(layerId); if(!x||!layer)return;\n    x.onchange=function(){layer.checked=x.checked;layer.dispatchEvent(new Event('input',{bubbles:true}))};\n  }\n  wireToggle('mfTrapsToggle','showTraps');\n  ['mfBait','mfPoi','mfSensor'].forEach(function(id){\n    var x=$(id); if(x)x.onchange=function(){redraw()};\n  });\n\n  function addStyle(){\n    if(document.getElementById('kaitiaki-filter-ui-style'))return;\n    var s=document.createElement('style');s.id='kaitiaki-filter-ui-style';\n    s.textContent='.modernFilters .mfGroup{border-top:1px solid #ccc;padding:12px 0}.modernFilters .mfBody{display:none}.modernFilters .mfGroup.open .mfBody{display:block}.modernFilters .mfRow{cursor:pointer;user-select:none}.modernFilters .mfHead button{cursor:pointer}';\n    document.head.appendChild(s);\n  }\n  addStyle();\n  setTimeout(window.mfBuild,100); setTimeout(window.mfBuild,700); setTimeout(window.mfBuild,1600);\n})();\n</script>\n<!-- KAITIAKI FILTER UI FIX v2 -->\n'''
          s = s.replace('</body>', patch + '</body>')
          p.write_text(s, encoding='utf-8')
