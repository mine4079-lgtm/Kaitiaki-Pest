name: Apply filter patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); x=Path('filter_interaction_patch.js').read_text(); p.write_text(s.replace('</script>\n</body>','</script>\n<script id=\"filter-interaction-patch\">'+x+'</script>\n</body>',1) if 'filter-interaction-patch' not in s else s)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enable modern filter controls [skip ci]'
          git push
