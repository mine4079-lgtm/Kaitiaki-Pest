name: Fix filter UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index.html filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_filters = "function filters(){return{line:$(\'line\').value,trapType:$(\'trapType\').value,monType:$(\'monType\').value,search:$(\'search\').value.trim().toLowerCase()}}"
          new_filters = "function filters(){var st=window.KPFilterState||{};return{line:st.line||[],trapType:st.trap||[],monType:st.mon||[],search:$(\'search\').value.trim().toLowerCase()}}"
          if old_filters not in s: raise SystemExit('filters() target not found')
          s=s.replace(old_filters,new_filters,1)
          old_pass = "function pass(t,f,mon){if(f.line&&t.line!==f.line)return false;var k=mon?'monType':'trapType';if(f[k]&&t.type!==f[k])return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().indexOf(f.search)>=0}"
          new_pass = "function pass(t,f,mon){var k=mon?'monType':'trapType',vals=f[k]||[];if(vals.length&&vals.indexOf(t.type)<0)return false;if(f.line&&f.line.length&&f.line.indexOf(t.line)<0)return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().indexOf(f.search)>=0}"
          if old_pass not in s: raise SystemExit('pass() target not found')
          s=s.replace(old_pass,new_pass,1)
          clean='''<script id="filter-interaction-patch">\n(function(){\nvar st=window.KPFilterState=window.KPFilterState||{trap:[],line:[],mon:[],ready:{trap:false,line:false,mon:false}};\nfunction sel(k){return document.getElementById(k==='trap'?'trapType':k==='line'?'line':'monType')}\nfunction body(k){return document.getElementById(k==='trap'?'mfTraps':k==='line'?'mfLines':'mfMons')}\nfunction vals(k){var s=sel(k);return s?Array.prototype.slice.call(s.options).map(function(o){return o.value}).filter(Boolean):[]}\nfunction sync(k){var a=vals(k),old=st[k]||[];if(!st.ready[k]){st[k]=a.slice();st.ready[k]=true;return}var keep=old.filter(function(v){return a.indexOf(v)>=0});st[k]=keep.length?keep:a.slice()}\nfunction fire(k){var s=sel(k);if(!s)return;s.value=st[k].length===1?st[k][0]:'';s.dispatchEvent(new Event('change',{bubbles:true}));s.dispatchEvent(new Event('input',{bubbles:true}))}\nfunction build(k){var b=body(k),s=sel(k);if(!b||!s)return;sync(k);b.innerHTML='';Array.prototype.slice.call(s.options).forEach(function(o){if(!o.value)return;var row=document.createElement('label');row.className='mfRow';var span=document.createElement('span');span.textContent=o.text;var cb=document.createElement('input');cb.type='checkbox';cb.checked=st[k].indexOf(o.value)>=0;cb.dataset.filterValue=o.value;cb.addEventListener('change',function(){if(cb.checked){if(st[k].indexOf(o.value)<0)st[k].push(o.value)}else st[k]=st[k].filter(function(v){return v!==o.value});fire(k);build(k)});row.appendChild(span);row.appendChild(cb);b.appendChild(row)})}\nwindow.mfBuild=function(){build('trap');build('line');build('mon')};\ndocument.addEventListener('click',function(e){var b=e.target.closest('.mfHead button');if(!b)return;var g=b.closest('.mfGroup');if(!g)return;e.preventDefault();g.classList.toggle('open');b.textContent=g.classList.contains('open')?'Hide types':'Show types'});\ndocument.addEventListener('DOMContentLoaded',function(){window.mfBuild()});setTimeout(function(){window.mfBuild()},250);\n})();\n</script>'''
          s,n1=re.subn(r'<script id="filter-interaction-patch">.*?</script>',clean,s,count=1,flags=re.S)
          s,n2=re.subn(r'<script id="modern-filter-js">.*?</script>','',s,count=1,flags=re.S)
          if n1!=1 or n2!=1: raise SystemExit(f'script replacement failed: {n1},{n2}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Fix Trap.NZ style filters"; git push origin main; fi
