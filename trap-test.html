<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaitiaki-Pest Trap.NZ Test</title><style>body{font-family:system-ui;padding:18px;max-width:700px;margin:auto}input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}button{background:#0d594b;color:#fff;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap;background:#eee;padding:12px;border-radius:8px;overflow:auto}.ok{font-weight:700}</style></head><body><h2>Trap.NZ connection test</h2><p>This page only reads Trap.NZ. It does not write anything.</p><input id="key" placeholder="Trap.NZ read-only map-feed API key"><input id="project" value="228563" placeholder="Project ID"><button onclick="run()">Test Trap.NZ</button><pre id="out">Ready.</pre><script>const $=id=>document.getElementById(id);function jsonp(url){return new Promise((resolve,reject)=>{const cb='kpTest_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove()};const t=setTimeout(()=>{clean();reject(Error('Timed out after 30 seconds'))},30000);window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(Error('Script request failed'))};s.src=url+(url.includes('?')?'&':'?')+'format_options='+encodeURIComponent('callback:'+cb);document.body.appendChild(s)})}async function one(base,type){const names=['default-project-'+type,'trapnz-projects:default-project-'+type];for(const name of names){const u=base+'?service=WFS&version=1.0.0&request=GetFeature&typeName='+encodeURIComponent(name)+'&outputFormat=text/javascript&maxFeatures=5';try{const d=await jsonp(u);const f=Array.isArray(d?.features)?d.features:[];if(f.length||d?.type==='FeatureCollection')return {name,count:f.length,data:d};}catch(e){return {name,error:e.message}}}return {error:'No usable FeatureCollection returned',name:names.join(' OR ')}}async function run(){const key=$('key').value.trim(),project=$('project').value.trim();if(!key||!/^[0-9]+$/.test(project))return $('out').textContent='Enter the Trap.NZ API key and numeric project ID.';const base='https://io.trap.nz/geo/trapnz-projects/wfs/'+encodeURIComponent(key)+'/'+encodeURIComponent(project);$('out').textContent='Testing...';try{const r={};for(const type of ['traps','monitoring-stations','lines'])r[type]=await one(base,type);$('out').textContent=JSON.stringify(r,(k,v)=>k==='data'?{type:v?.type,features:v?.features?.slice(0,1),keys:Object.keys(v||{})}:v,2)}catch(e){$('out').textContent='TEST ERROR\n'+e.message}}</script></body></html>
