<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaitiaki-Pest</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}#map{position:absolute;inset:0}.top{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill,.btn,.drawer,.popupbox{background:#fff;box-shadow:0 3px 14px #0003}.pill{padding:11px 14px;border-radius:17px;font-weight:800;font-size:15px;pointer-events:auto}.actions{display:flex;gap:8px;pointer-events:auto}.btn{border:0;border-radius:13px;min-width:50px;height:50px;font-size:24px}.right{position:absolute;right:12px;top:78px;z-index:20;display:flex;flex-direction:column;gap:10px}.bottom{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;z-index:20;display:flex;box-shadow:0 -3px 12px #0002}.bottom button{flex:1;border:0;background:#fff;font-weight:750;font-size:13px}.bottom button.active{background:#0d594b;color:#fff}.gps{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);z-index:21;width:60px;height:60px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px #0004;font-size:27px}.status{position:absolute;left:12px;bottom:84px;z-index:19;background:#fff;padding:8px 11px;border-radius:10px;font-size:11px;box-shadow:0 2px 8px #0002;max-width:72%}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(390px,92vw);z-index:40;transform:translateX(105%);transition:.2s;overflow:auto;padding:18px}.drawer.open{transform:translateX(0)}.close{float:right;border:0;background:none;font-size:30px}.drawer h2{margin:0 0 8px}.hint{font-size:12px;color:#64748b}.section{border-top:1px solid #ddd;padding:15px 0}.section>b{font-size:16px}.section label{display:block;padding:8px 0}.section input[type=text],.section select{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;background:#fff;font-size:15px}.sync{width:100%;padding:13px;border:0;border-radius:10px;background:#0d594b;color:#fff;font-weight:800}.danger{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;background:#fff}.popupbox{max-width:min(440px,90vw);max-height:78vh;overflow:auto;border-radius:10px;padding:15px}.popupbox h3{margin:0 0 12px;font-size:22px}.detail{display:grid;grid-template-columns:135px 1fr;gap:8px;margin:7px 0;font-size:13px;line-height:1.3}.details{border-top:1px solid #ddd;padding-top:9px;margin-top:8px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{border:1px solid #ddd;border-radius:9px;padding:9px}.stat b{display:block;font-size:20px}.history{border-top:1px solid #ddd;margin-top:10px;padding-top:9px}.history h4{margin:0 0 5px}.historyrow{padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.historyrow strong{display:block;font-size:13px;margin-bottom:3px}.historyrow span{display:block;margin:2px 0}.nav{display:inline-block;margin-top:10px;border:0;border-radius:9px;padding:10px 13px;background:#0d594b;color:#fff;text-decoration:none;font-weight:700}.maplibregl-popup-content{padding:0!important;background:transparent!important;box-shadow:none!important}.maplibregl-popup-tip{display:none}.maplibregl-popup-close-button{z-index:2;font-size:22px;padding:5px}.maplibregl-ctrl-attrib{font-size:9px}
</style></head>
<body><div id="app"><div id="map"></div>
<div class="top"><div class="pill" id="counts">0 traps • 0 monitoring • 0 lines</div><div class="actions"><button class="btn" id="filterBtn">☰</button><button class="btn" id="syncBtn">↻</button><button class="btn" id="menuBtn">☰</button></div></div>
<div class="right"><button class="btn" id="zin">＋</button><button class="btn" id="zout">−</button><button class="btn" id="searchBtn">⌕</button></div><button class="gps" id="gps">⌖</button><div class="status" id="status">Map ready — sync Trap.NZ to load your project.</div>
<div class="bottom"><button class="active">👤<br>Tracks</button><button id="centre">⛶<br>Auto centre</button><button id="linesTab">⌁<br>Lines</button><button id="add">＋<br>Add</button></div>
<div class="drawer" id="drawer"><button class="close" id="close">×</button><h2>Map filters</h2><div class="hint">Trap.NZ data is read-only here. Nothing is written back to Trap.NZ.</div>
<div class="section"><b>Layers</b><label><input id="showTraps" type="checkbox" checked> Traps</label><label><input id="showMon" type="checkbox" checked> Monitoring</label><label><input id="showLines" type="checkbox" checked> Trap lines</label><label><input id="showNumbers" type="checkbox" checked> Trap numbers</label><label><input id="showLineNames" type="checkbox" checked> Line names</label><label><input id="showMonNames" type="checkbox" checked> Monitoring names</label></div>
<div class="section"><b>Filter by line</b><select id="line"><option value="">All lines</option></select></div><div class="section"><b>Trap type</b><select id="trapType"><option value="">All trap types</option></select></div><div class="section"><b>Monitoring type</b><select id="monType"><option value="">All monitoring types</option></select></div><div class="section"><input id="search" type="text" placeholder="Search trap, site or line..."></div>
<div class="section"><b>Base map</b><label><input type="radio" name="base" value="street" checked> Street</label><label><input type="radio" name="base" value="satellite"> Satellite</label><label><input type="radio" name="base" value="topo"> Topographic</label><input id="linzKey" type="text" placeholder="LINZ API key"><button class="danger" id="saveKey">Save LINZ key</button><div class="hint" id="mapStatus">Street map works without a LINZ key.</div></div>
<div class="section"><button class="sync" id="sync2">↻ Sync Trap.NZ</button></div></div></div></div>
<script>
const DATA={traps:[],monitoring:[],lines:[],records:[],baitStations:[]};let map=null,mapReady=false,bound=false,selected={line:'',trap:''};const $=id=>document.getElementById(id),DB='kaitiaki_pest_db_v3';
function field(o,keys,def=''){for(const k of keys){let v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return def}
function text(v){if(v&&typeof v==='object')return field(v,['name','title','code','username','id'],JSON.stringify(v));return String(v??'')}
function esc(v){return text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('en-NZ',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function trapCode(t){return text(field(t,['title','name','trap_code','code','trap_number','number','id'],''))}
function trapKey(t){return text(field(t,['id','nid','trap_id','main_trap_id','uuid'],''))}
function recordKeys(r){return ['trap_code','trapCode','trap_name','trapName','trap_id','trapId','trap_nid','trapNid','trap_node_id','main_trap_id','mainTrapId'].map(k=>text(r?.[k]).trim().toLowerCase()).filter(Boolean)}
function recordDate(r){return field(r,['record_date','recordDate','date','created_at','created'],'')}
function recSpecies(r){return text(field(r,['species_caught','speciesCaught','species','catch_species','catch'],'')).trim()}
function isCatch(r){const s=recSpecies(r).toLowerCase();return !!s&&s!=='none'&&s!=='no catch'&&s!=='null'}
function recordsFor(t){const ids=[trapCode(t),trapKey(t),text(t.name),text(t.code),text(t.trap_code),text(t.trap_number),text(t.number)].filter(Boolean).map(x=>x.trim().toLowerCase());return DATA.records.filter(r=>recordKeys(r).some(k=>ids.includes(k))).sort((a,b)=>new Date(recordDate(b))-new Date(recordDate(a)))}
function catchCount(r){const n=Number(field(r,['number_caught','numberCaught','count_caught','count','quantity'],''));return Number.isFinite(n)&&n>0?n:1}
function statsFor(t){const rows=recordsFor(t),by={};for(const r of rows)if(isCatch(r)){const s=recSpecies(r)||'Unknown';by[s]=(by[s]||0)+catchCount(r)}return{rows,by,total:Object.values(by).reduce((a,b)=>a+b,0),possums:rows.filter(r=>recSpecies(r).toLowerCase().includes('possum')).reduce((a,r)=>a+catchCount(r),0)}}
function niceKey(k){return k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function rawExtra(t,used){const p=t.raw||{},skip=new Set(['id','nid','uuid','trap_id','main_trap_id','trap_code','code','title','name','trap_number','number','type','trap_type','line','line_name','lat','lon','latitude','longitude','geometry']);const a=[];Object.keys(p).sort().forEach(k=>{if(skip.has(k)||used.has(k))return;const v=p[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')a.push([niceKey(k),text(v)])});return a}
function popup(html,ll){new maplibregl.Popup({closeButton:true,closeOnClick:true,maxWidth:'460px',offset:12}).setLngLat(ll).setHTML('<div class="popupbox">'+html+'</div>').addTo(map)}
function showTrap(t){const s=statsFor(t),rows=s.rows,used=new Set();const add=(label,keys,def='—')=>{const v=field(t,keys,def);if(v!==''&&v!==null&&v!==undefined){used.add(keys[0]);return '<div class="detail"><b>'+esc(label)+':</b><span>'+esc(v)+'</span></div>'}return ''};let details=add('Trap number',[ 'title','name','trap_code','code','trap_number','number'], '—');details+=add('Type',['type','trap_type'],'—');details+=add('Line',['line','line_name'],'—');details+='<div class="detail"><b>GPS:</b><span>'+Number(t.lat).toFixed(6)+', '+Number(t.lon).toFixed(6)+'</span></div>';details+=add('Installed',['date_installed','installed_date','installation_date'],'—');details+=add('Installed By',['installed_by','installedBy','installer','installer_name','created_by_name','created_by'],'—');details+=add('Device model',['device_model','model','trap_sub_type'],'—');details+=add('Sensor provider',['sensor_provider','sensorProvider'],'—');details+=add('Sensor ID',['sensor_id','sensorId'],'—');details+=add('Retired',['is_retired','retired'],'0');details+=add('Notes',['notes'],'—');for(const [k,v] of rawExtra(t,used))details+='<div class="detail"><b>'+esc(k)+':</b><span>'+esc(v)+'</span></div>';const catches=Object.entries(s.by).map(([k,v])=>'<div class="stat"><b>'+v.toLocaleString()+'</b>'+esc(k)+' catches</div>').join('')||'<div class="stat"><b>0</b>Total catches</div>';const hist=rows.length?rows.map(r=>'<div class="historyrow"><strong>'+esc(fmtDate(recordDate(r)))+'</strong><span>Catch: '+esc(recSpecies(r)||'None')+'</span><span>Status: '+esc(field(r,['trap_status','trapStatus','status'],'—'))+'</span><span>Condition: '+esc(field(r,['trap_condition','trapCondition','condition'],'—'))+'</span><span>Re-baited: '+esc(field(r,['rebaited'],'—'))+'</span><span>Bait at arrival: '+esc(field(r,['bait_at_arrival','baitArrival'],'—'))+'</span><span>Bait at departure: '+esc(field(r,['bait_at_departure','baitDeparture'],'—'))+'</span><span>Strikes: '+esc(field(r,['strikes'],'0'))+'</span><span>Recorded by: '+esc(field(r,['recorded_by','recordedBy','operator','user_name','username'],'—'))+'</span>'+((field(r,['record_notes','recordNotes','notes'],'')!=='')?'<span>Notes: '+esc(field(r,['record_notes','recordNotes','notes']))+'</span>':'')+'</div>').join(''):'<div class="hint">No monitoring records found for this trap.</div>';const nav='https://www.google.com/maps/dir/?api=1&destination='+Number(t.lat)+','+Number(t.lon);popup('<h3>'+esc(trapCode(t))+'</h3><div class="details">'+details+'</div><div class="summary"><div class="stat"><b>'+s.possums.toLocaleString()+'</b>Possum catches</div>'+catches+'</div><div class="history"><h4>Monitoring history ('+rows.length+')</h4>'+hist+'</div><a class="nav" target="_blank" rel="noopener" href="'+nav+'">Navigate</a>',[+t.lon,+t.lat])}
function showMon(m){popup('<h3>'+esc(field(m,['name','code','number','id'],'Monitoring'))+'</h3><div class="details"><div class="detail"><b>Type:</b><span>'+esc(m.type||'Monitoring')+'</span></div><div class="detail"><b>Line:</b><span>'+esc(m.line||'—')+'</span></div><div class="detail"><b>GPS:</b><span>'+Number(m.lat).toFixed(6)+', '+Number(m.lon).toFixed(6)+'</span></div><div class="detail"><b>Installed:</b><span>'+esc(m.installed||'—')+'</span></div><div class="detail"><b>Installed By:</b><span>'+esc(m.installedBy||'—')+'</span></div><div class="detail"><b>Notes:</b><span>'+esc(m.notes||'—')+'</span></div></div>',[+m.lon,+m.lat])}
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function saveData(){try{const d=await db(),tx=d.transaction('data','readwrite'),s=tx.objectStore('data');for(const k of Object.keys(DATA))s.put(DATA[k],k);tx.oncomplete=()=>d.close()}catch(e){console.error(e)}}async function loadData(){try{const d=await db(),tx=d.transaction('data','readonly'),s=tx.objectStore('data');for(const k of Object.keys(DATA)){const v=await new Promise((res,rej)=>{const q=s.get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(Array.isArray(v))DATA[k]=v}d.close()}catch(e){console.error(e)}}
function bounds(){const p=[];DATA.traps.forEach(t=>p.push([+t.lon,+t.lat]));DATA.monitoring.forEach(t=>p.push([+t.lon,+t.lat]));DATA.baitStations.forEach(t=>p.push([+t.lon,+t.lat]));DATA.lines.forEach(l=>(l.points||[]).forEach(x=>p.push(x)));const a=p.filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));if(!a.length)return [[177,-38.02],[177.08,-37.97]];const xs=a.map(x=>x[0]),ys=a.map(x=>x[1]),pad=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*.04||.001;return [[Math.min(...xs)-pad,Math.min(...ys)-pad],[Math.max(...xs)+pad,Math.max(...ys)+pad]]}
function osm(){return{version:8,sources:{base:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'base',type:'raster',source:'base'}]}}
function mapStyle(type){const k=localStorage.getItem('kp_linz_key')||'';if(type==='satellite'&&k)return{version:8,sources:{base:{type:'raster',tiles:[`https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api=${encodeURIComponent(k)}`],tileSize:256,attribution:'© LINZ'}},layers:[{id:'base',type:'raster',source:'base'}]};if(type==='topo'&&k)return `https://basemaps.linz.govt.nz/v1/styles/topographic-v2.json?api=${encodeURIComponent(k)}`;return osm()}
function filters(){return{line:$('line').value,trapType:$('trapType').value,monType:$('monType').value,search:$('search').value.trim().toLowerCase()}}function pass(t,f,mon=false){if(f.line&&t.line!==f.line)return false;if(f[mon?'monType':'trapType']&&t.type!==f[mon?'monType':'trapType'])return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().includes(f.search)}
function geo(){const f=filters(),features=[];if($('showLines').checked)DATA.lines.forEach(l=>{if(f.line&&l.name!==f.line)return;features.push({type:'Feature',geometry:{type:'LineString',coordinates:l.points},properties:{kind:'line',name:String(l.name||''),colour:l.colour||'#2563eb'}})});if($('showTraps').checked)DATA.traps.forEach(t=>{if(!pass(t,f))return;features.push({type:'Feature',geometry:{type:'Point',coordinates:[+t.lon,+t.lat]},properties:{kind:'trap',id:trapKey(t),name:trapCode(t),selected:trapKey(t)===String(selected.trap)?'1':'0'}})});if($('showMon').checked)DATA.monitoring.forEach(m=>{if(!pass(m,f,true))return;features.push({type:'Feature',geometry:{type:'Point',coordinates:[+m.lon,+m.lat]},properties:{kind:'monitoring',id:String(field(m,['id','nid','number'],'')),name:String(field(m,['name','code','number','number_code','nid'],'')),glyph:monitorGlyph(m.type)}})});return{type:'FeatureCollection',features}}
function monitorGlyph(t){const s=String(t||'').toLowerCase();return s.includes('camera')?'📷':(s.includes('wax')||s.includes('tag'))?'🟨':s.includes('bird')?'🐦':(s.includes('tracking')||s.includes('tunnel'))?'🐾':s.includes('chew')?'🟫':'📍'}
function ensureLayers(){if(!map||!map.isStyleLoaded())return;const src=map.getSource('kp-data');if(src)src.setData(geo());else map.addSource('kp-data',{type:'geojson',data:geo()});const add=(id,l)=>{if(!map.getLayer(id))map.addLayer(l)};add('kp-lines',{id:'kp-lines',type:'line',source:'kp-data',filter:['==',['get','kind'],'line'],paint:{'line-color':['coalesce',['get','colour'],'#2563eb'],'line-width':4,'line-opacity':.9}});add('kp-traps',{id:'kp-traps',type:'circle',source:'kp-data',filter:['==',['get','kind'],'trap'],paint:{'circle-radius':6,'circle-color':['case',['==',['get','selected'],'1'],'#dc2626','#16803c'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});add('kp-mon',{id:'kp-mon',type:'circle',source:'kp-data',filter:['==',['get','kind'],'monitoring'],paint:{'circle-radius':6,'circle-color':'#f59e0b','circle-stroke-color':'#fff','circle-stroke-width':1.5}});add('kp-labels',{id:'kp-labels',type:'symbol',source:'kp-data',filter:['in',['get','kind'],['literal',['trap','monitoring']]],layout:{'text-field':['get','name'],'text-size':11,'text-offset':[.75,.75],'text-anchor':'left','text-allow-overlap':false},paint:{'text-color':'#17202a','text-halo-color':'#fff','text-halo-width':1.7}});add('kp-mon-icons',{id:'kp-mon-icons',type:'symbol',source:'kp-data',filter:['==',['get','kind'],'monitoring'],layout:{'text-field':['get','glyph'],'text-size':16,'text-allow-overlap':true},paint:{'text-halo-color':'#fff','text-halo-width':1}});add('kp-line-labels',{id:'kp-line-labels',type:'symbol',source:'kp-data',filter:['==',['get','kind'],'line'],layout:{'symbol-placement':'line','text-field':['get','name'],'text-size':11,'text-allow-overlap':false},paint:{'text-color':'#17202a','text-halo-color':'#fff','text-halo-width':2}});visibility();events()}
function visibility(){if(!map)return;const v=(id,on)=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none');v('kp-lines',$('showLines').checked);v('kp-traps',$('showTraps').checked);v('kp-mon',$('showMon').checked);v('kp-labels',$('showNumbers').checked||$('showMonNames').checked);v('kp-line-labels',$('showLineNames').checked&&$('showLines').checked);v('kp-mon-icons',$('showMon').checked)}
function update(){if(!mapReady)return;map.getSource('kp-data')?.setData(geo());visibility();$('counts').textContent=`${DATA.traps.length.toLocaleString()} traps • ${DATA.monitoring.length.toLocaleString()} monitoring • ${DATA.lines.length.toLocaleString()} lines`;populate();$('status').textContent=selected.line?`${DATA.traps.filter(t=>t.line===selected.line).length} traps on ${selected.line}`:'Map ready — Trap.NZ data loaded.'}
function events(){if(bound)return;bound=true;map.on('click','kp-traps',e=>{const p=e.features?.[0]?.properties||{},t=DATA.traps.find(x=>trapKey(x)===String(p.id));if(t){selected.trap=trapKey(t);showTrap(t);update()}});map.on('click','kp-labels',e=>{const p=e.features?.[0]?.properties||{};if(p.kind==='trap'){const t=DATA.traps.find(x=>trapKey(x)===String(p.id));if(t)showTrap(t)}else{const m=DATA.monitoring.find(x=>String(field(x,['id','nid','number'],''))===String(p.id));if(m)showMon(m)}});map.on('click','kp-mon',e=>{const p=e.features?.[0]?.properties||{},m=DATA.monitoring.find(x=>String(field(x,['id','nid','number'],''))===String(p.id));if(m)showMon(m)});map.on('click','kp-lines',e=>{const p=e.features?.[0]?.properties||{};if(p.name){selected.line=String(p.name);$('line').value=selected.line;update()}});['kp-traps','kp-mon','kp-lines'].forEach(id=>{map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='')})}
function populate(){const names=[...new Set([...DATA.lines.map(x=>x.name),...DATA.traps.map(x=>x.line),...DATA.monitoring.map(x=>x.line)].filter(Boolean))].sort((a,b)=>a.localeCompare(b)),l=$('line'),old=l.value;l.innerHTML='<option value="">All lines</option>';names.forEach(x=>l.append(new Option(x,x)));if(names.includes(old))l.value=old;[['trapType',DATA.traps.map(x=>x.type),'trap types'],['monType',DATA.monitoring.map(x=>x.type),'monitoring types']].forEach(([id,vals,txt])=>{const el=$(id),o=el.value;el.innerHTML='<option value="">All '+txt+'</option>';[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(x=>el.append(new Option(x,x)));if([...el.options].some(x=>x.value===o))el.value=o})}
async function syncTrapNZ(){const oldKey=localStorage.getItem('kp_trapnz_key')||'',oldProject=localStorage.getItem('kp_trapnz_project')||'',key=prompt('Enter your Trap.NZ map-feed API key. Read-only only.',oldKey);if(!key)return;const project=prompt('Enter your Trap.NZ project ID.',oldProject);if(!project||!/^[0-9]+$/.test(project.trim()))return alert('Valid Trap.NZ project ID required.');localStorage.setItem('kp_trapnz_key',key.trim());localStorage.setItem('kp_trapnz_project',project.trim());const base=`https://io.trap.nz/geo/trapnz-projects/wfs/${encodeURIComponent(key.trim())}/${encodeURIComponent(project.trim())}`;$('status').textContent='Syncing Trap.NZ — read-only…';try{async function page(type,start=0){const u=base+`?service=WFS&version=1.1.0&request=GetFeature&typeName=${encodeURIComponent(type)}&outputFormat=application/json&count=5000&startIndex=${start}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${type}: HTTP ${r.status}`);return r.json()}async function all(type){const out=[];for(let i=0;;i+=5000){const g=await page(type,i),fs=Array.isArray(g.features)?g.features:[];out.push(...fs);if(fs.length<5000)break}return out}const [tr,mo,li,ba,re]=await Promise.all([all('trapnz-projects:default-project-traps'),all('trapnz-projects:default-project-monitoring-stations'),all('trapnz-projects:default-project-lines'),all('trapnz-projects:default-project-bait-stations'),all('trapnz-projects:default-project-trap-records')]);DATA.traps=tr.map(f=>{const p=f.properties||{},g=f.geometry||{},c=g.coordinates||[];return{id:text(field(p,['nid','id','trap_id','main_trap_id','uuid'],'')),title:text(field(p,['name','trap_code','code','title','trap_number','number','id'],'Trap')),name:text(field(p,['name'],'')),code:text(field(p,['code'],'')),trap_code:text(field(p,['trap_code'],'')),line:text(field(p,['line','line_name'],'')),type:text(field(p,['trap_type','type'],'Trap')),lat:+c[1],lon:+c[0],installed:field(p,['date_installed','installed_date','installation_date']),installedBy:field(p,['installed_by','installedBy','installer','installer_name']),sensorProvider:text(field(p,['sensor_provider','sensorProvider'],'')),sensorId:text(field(p,['sensor_id','sensorId'],'')),retired:field(p,['is_retired','retired'],'0'),notes:field(p,['notes']),project:field(p,['project','project_name']),project_id:field(p,['project_id','project_nid']),raw:p}}).filter(t=>Number.isFinite(t.lat)&&Number.isFinite(t.lon));DATA.monitoring=mo.map(f=>{const p=f.properties||{},g=f.geometry||{},c=g.coordinates||[];return{id:text(field(p,['nid','id','number','code'],'')),name:text(field(p,['name','code','number','number_code','nid'],'')),code:text(field(p,['code'],'')),number:text(field(p,['number'],'')),line:text(field(p,['line','line_name'],'')),type:text(field(p,['monitoring_type','type','monitoringType'],'Monitoring')),lat:+c[1],lon:+c[0],installed:field(p,['date_installed','installed_date','installation_date']),installedBy:text(field(p,['installed_by','installedBy','installer','installer_name'],'')),notes:field(p,['notes']),raw:p}}).filter(m=>Number.isFinite(m.lat)&&Number.isFinite(m.lon));DATA.lines=[];for(const f of li){const p=f.properties||{},g=f.geometry||{},parts=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];for(const c of parts)if(c?.length>=2)DATA.lines.push({name:text(field(p,['line','name','title'],`Line ${DATA.lines.length+1}`)),points:c.map(x=>[+x[0],+x[1]]),colour:text(field(p,['colour','color'],'#2563eb'))})}DATA.baitStations=ba.map(f=>{const p=f.properties||{},g=f.geometry||{},c=g.coordinates||[];return{id:text(field(p,['bait_station_id','id','nid'],'')),name:text(field(p,['code','name','bait_station_code','bait_station_id'],'Bait station')),line:text(field(p,['line','line_name'],'')),type:text(field(p,['bait_station_type','type'],'Bait station')),lat:+c[1],lon:+c[0],notes:field(p,['notes']),raw:p}}).filter(b=>Number.isFinite(b.lat)&&Number.isFinite(b.lon));DATA.records=re.map(f=>({...f.properties,raw:f.properties||{}}));if(!DATA.traps.length||!DATA.lines.length)throw Error(`Trap.NZ returned ${DATA.traps.length} traps and ${DATA.lines.length} lines.`);selected={line:'',trap:''};await saveData();populate();update();map.fitBounds(bounds(),{padding:35});$('status').textContent=`Trap.NZ sync complete — ${DATA.traps.length.toLocaleString()} traps • ${DATA.records.length.toLocaleString()} trap records • ${DATA.monitoring.length.toLocaleString()} monitoring • ${DATA.lines.length.toLocaleString()} lines. READ-ONLY.`;alert(`Trap.NZ sync complete.\n\n${DATA.traps.length.toLocaleString()} traps\n${DATA.records.length.toLocaleString()} trap records\n${DATA.monitoring.length.toLocaleString()} monitoring stations\n${DATA.lines.length.toLocaleString()} lines\n\nNothing was written to Trap.NZ.`)}catch(e){console.error(e);$('status').textContent='Trap.NZ sync failed — existing local data was kept.';alert('Sync failed: '+e.message+'\n\nNo changes were sent to Trap.NZ.')}}
function init(){const b=localStorage.getItem('kp_basemap')||'street';$('linzKey').value=localStorage.getItem('kp_linz_key')||'';document.querySelectorAll('input[name="base"]').forEach(r=>r.checked=r.value===b);map=new maplibregl.Map({container:'map',style:mapStyle(b),center:[177.04,-37.99],zoom:12,attributionControl:true});map.on('load',async()=>{mapReady=true;await loadData();populate();ensureLayers();map.fitBounds(bounds(),{padding:35});if(DATA.traps.length)$('status').textContent=`${DATA.traps.length.toLocaleString()} traps • ${DATA.records.length.toLocaleString()} trap records loaded.`});map.on('style.load',()=>{if(mapReady){ensureLayers();map.fitBounds(bounds(),{padding:35)}})}
$('filterBtn').onclick=()=>$('drawer').classList.add('open');$('close').onclick=()=>$('drawer').classList.remove('open');$('syncBtn').onclick=syncTrapNZ;$('sync2').onclick=syncTrapNZ;$('zin').onclick=()=>map.zoomIn();$('zout').onclick=()=>map.zoomOut();$('centre').onclick=()=>map.fitBounds(bounds(),{padding:35});$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:Math.max(map.getZoom(),16)}));$('searchBtn').onclick=()=>{$('drawer').classList.add('open');$('search').focus()};['line','trapType','monType','search','showTraps','showMon','showLines','showNumbers','showLineNames','showMonNames'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='line')selected.line=$('line').value;update()}));document.querySelectorAll('input[name="base"]').forEach(r=>r.onchange=()=>{localStorage.setItem('kp_basemap',r.value);map.setStyle(mapStyle(r.value))});$('saveKey').onclick=()=>{localStorage.setItem('kp_linz_key',$('linzKey').value.trim());$('mapStatus').textContent='LINZ key saved on this phone.';map.setStyle(mapStyle(document.querySelector('input[name="base"]:checked').value))};init();
</script></body></html>
