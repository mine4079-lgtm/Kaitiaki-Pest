<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaitiaki-Pest Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:#dfeaec;color:#17202a}#map{position:absolute;inset:0}.top{position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill,.btn,.drawer,.panel{background:#fff;box-shadow:0 3px 12px #0003}.pill{padding:10px 14px;border-radius:16px;font-weight:700;font-size:14px;pointer-events:auto}.actions{display:flex;gap:8px;pointer-events:auto}.btn{border:0;border-radius:12px;min-width:48px;height:48px;font-size:23px}.right{position:absolute;right:12px;top:76px;z-index:10;display:flex;flex-direction:column;gap:10px}.bottom{position:absolute;left:0;right:0;bottom:0;height:70px;background:#fff;z-index:10;display:flex;box-shadow:0 -3px 12px #0002}.bottom button{flex:1;border:0;background:#fff;font-weight:700;font-size:13px}.bottom button.active{background:#0d594b;color:#fff}.gps{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);z-index:11;width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px #0004;font-size:26px}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(370px,90vw);z-index:30;transform:translateX(105%);transition:.2s;overflow:auto;padding:18px}.drawer.open{transform:translateX(0)}.drawer h2{margin:0 0 14px}.close{float:right;border:0;background:none;font-size:28px}.section{border-top:1px solid #ddd;padding:14px 0}.section label{display:block;padding:8px 0}.section input[type=text],.section select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;background:#fff}.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.sync{width:100%;padding:12px;border:0;border-radius:9px;background:#0d594b;color:#fff;font-weight:700}.status{position:absolute;left:12px;bottom:82px;z-index:9;background:#fff;padding:7px 10px;border-radius:9px;font-size:11px;box-shadow:0 2px 8px #0002;max-width:70%}.maplibregl-ctrl-attrib{font-size:9px}.popup h3{margin:0 0 6px}.popup p{margin:4px 0;font-size:13px}.nav{border:0;border-radius:8px;padding:8px;background:#0d594b;color:#fff}.hint{font-size:12px;color:#64748b}.danger{width:100%;padding:10px;border:1px solid #bbb;border-radius:9px;background:#fff}
</style>
</head>
<body>
<div id="app"><div id="map"></div>
<div class="top"><div class="pill" id="counts">0 traps • 0 monitoring • 0 lines</div><div class="actions"><button class="btn" id="filterBtn">☰</button><button class="btn" id="syncBtn">↻</button><button class="btn" id="menuBtn">☰</button></div></div>
<div class="right"><button class="btn" id="zin">＋</button><button class="btn" id="zout">−</button><button class="btn" id="searchBtn">⌕</button></div>
<button class="gps" id="gps">⌖</button><div class="status" id="status">Map ready — sync Trap.NZ to load your project.</div>
<div class="bottom"><button class="active">👤<br>Tracks</button><button id="centre">⛶<br>Auto centre</button><button id="linesTab">⌁<br>Lines</button><button id="add">＋<br>Add</button></div>
<div class="drawer" id="drawer"><button class="close" id="close">×</button><h2>Map filters</h2><div class="hint">Map first. Read-only — nothing is written back to Trap.NZ.</div>
<div class="section"><b>Layers</b><label><input id="showTraps" type="checkbox" checked> Traps</label><label><input id="showMon" type="checkbox" checked> Monitoring</label><label><input id="showLines" type="checkbox" checked> Trap lines</label></div>
<div class="section"><b>Filter by line</b><select id="line"><option value="">All lines</option></select></div>
<div class="section"><b>Trap type</b><select id="trapType"><option value="">All trap types</option></select></div>
<div class="section"><b>Monitoring type</b><select id="monType"><option value="">All monitoring types</option></select></div>
<div class="section"><input id="search" type="text" placeholder="Search trap, site or line..."></div>
<div class="section"><button class="sync" id="sync2">↻ Sync Trap.NZ</button></div>
<div class="section"><b>Map</b><label><input type="radio" name="base" value="street" checked> Street</label><label><input type="radio" name="base" value="satellite"> Satellite</label><label><input type="radio" name="base" value="topo"> Topographic</label><input id="linzKey" type="text" placeholder="LINZ API key"><button class="danger" id="saveKey">Save LINZ key</button><div class="hint" id="mapStatus">Street map works without a LINZ key.</div></div>
</div></div>
<script>
const DATA={traps:[],monitoring:[],lines:[]};
let map,selectedLine='',selectedTrap='';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('kp_traps',JSON.stringify(DATA.traps));localStorage.setItem('kp_monitoring',JSON.stringify(DATA.monitoring));localStorage.setItem('kp_lines',JSON.stringify(DATA.lines))}
function load(){try{DATA.traps=JSON.parse(localStorage.getItem('kp_traps')||'[]')}catch{}try{DATA.monitoring=JSON.parse(localStorage.getItem('kp_monitoring')||'[]')}catch{}try{DATA.lines=JSON.parse(localStorage.getItem('kp_lines')||'[]')}catch{}}
load();
function bounds(){let pts=[];DATA.lines.forEach(l=>(l.points||[]).forEach(p=>pts.push(p)));DATA.traps.forEach(t=>pts.push([+t.lon,+t.lat]));DATA.monitoring.forEach(m=>pts.push([+m.lon,+m.lat]));pts=pts.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(!pts.length)return [[177.0,-38.02],[177.08,-37.97]];let a=pts.map(p=>p[0]),b=pts.map(p=>p[1]),pad=Math.max(Math.max(...a)-Math.min(...a),Math.max(...b)-Math.min(...b))*.05||.001;return [[Math.min(...a)-pad,Math.min(...b)-pad],[Math.max(...a)+pad,Math.max(...b)+pad]]}
function osm(){return{version:8,sources:{base:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'base',type:'raster',source:'base'}]}}
function style(type){let k=localStorage.getItem('kp_linz_key')||'';if(type==='satellite'&&k)return{version:8,sources:{base:{type:'raster',tiles:[`https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api=${encodeURIComponent(k)}`],tileSize:256,attribution:'© LINZ'}},layers:[{id:'base',type:'raster',source:'base'}]};if(type==='topo'&&k)return`https://basemaps.linz.govt.nz/v1/styles/topographic-v2.json?api=${encodeURIComponent(k)}`;return osm()}
function geo(){let fs=[],line=$('line').value,tt=$('trapType').value,mt=$('monType').value,q=$('search').value.trim().toLowerCase();if($('showLines').checked)DATA.lines.forEach(l=>{if(line&&l.name!==line)return;fs.push({type:'Feature',geometry:{type:'LineString',coordinates:l.points},properties:{kind:'line',name:l.name||''}})});if($('showTraps').checked)DATA.traps.forEach(t=>{if(line&&t.line!==line||tt&&t.type!==tt)return;let s=[t.id,t.title,t.line,t.type].join(' ').toLowerCase();if(q&&!s.includes(q))return;fs.push({type:'Feature',geometry:{type:'Point',coordinates:[+t.lon,+t.lat]},properties:{kind:'trap',id:String(t.id||''),name:String(t.title||t.id||''),line:String(t.line||''),type:String(t.type||'Trap')}})});if($('showMon').checked)DATA.monitoring.forEach(m=>{if(line&&m.line!==line||mt&&m.type!==mt)return;let s=[m.id,m.name,m.code,m.line,m.type].join(' ').toLowerCase();if(q&&!s.includes(q))return;fs.push({type:'Feature',geometry:{type:'Point',coordinates:[+m.lon,+m.lat]},properties:{kind:'monitoring',id:String(m.id||''),name:String(m.name||m.code||m.id||''),line:String(m.line||''),type:String(m.type||'Monitoring')}})});return{type:'FeatureCollection',features:fs}}
function layers(){if(!map.isStyleLoaded())return;let src=map.getSource('kp');if(src)src.setData(geo());else map.addSource('kp',{type:'geojson',data:geo()});const add=(id,o)=>{if(!map.getLayer(id))map.addLayer(o)};add('lines',{id:'lines',type:'line',source:'kp',filter:['==',['get','kind'],'line'],paint:{'line-color':'#2563eb','line-width':4,'line-opacity':.85}});add('traps',{id:'traps',type:'circle',source:'kp',filter:['==',['get','kind'],'trap'],paint:{'circle-radius':6,'circle-color':'#16803c','circle-stroke-color':'#fff','circle-stroke-width':1.5}});add('mon',{id:'mon',type:'circle',source:'kp',filter:['==',['get','kind'],'monitoring'],paint:{'circle-radius':6,'circle-color':'#f59e0b','circle-stroke-color':'#fff','circle-stroke-width':1.5}});add('labels',{id:'labels',type:'symbol',source:'kp',layout:{'text-field':['get','name'],'text-size':10,'text-offset':[.7,.7],'text-anchor':'left','text-allow-overlap':false},paint:{'text-color':'#17202a','text-halo-color':'#fff','text-halo-width':1.5}});update()}
function update(){if(!map)return;let s=map.getSource('kp');if(s)s.setData(geo());const v=(id,on)=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none');v('traps',$('showTraps').checked);v('mon',$('showMon').checked);v('lines',$('showLines').checked);v('labels','visible');$('counts').textContent=`${DATA.traps.length.toLocaleString()} traps • ${DATA.monitoring.length.toLocaleString()} monitoring • ${DATA.lines.length.toLocaleString()} lines`;populate()}
function populate(){let ls=[...new Set(DATA.lines.map(x=>x.name).filter(Boolean))].sort();let l=$('line'),old=l.value;l.innerHTML='<option value="">All lines</option>';ls.forEach(x=>l.append(new Option(x,x)));if(ls.includes(old))l.value=old;let ts=[...new Set(DATA.traps.map(x=>x.type).filter(Boolean))].sort(),t=$('trapType'),to=t.value;t.innerHTML='<option value="">All trap types</option>';ts.forEach(x=>t.append(new Option(x,x)));if(ts.includes(to))t.value=to;let ms=[...new Set(DATA.monitoring.map(x=>x.type).filter(Boolean))].sort(),m=$('monType'),mo=m.value;m.innerHTML='<option value="">All monitoring types</option>';ms.forEach(x=>m.append(new Option(x,x)));if(ms.includes(mo))m.value=mo}
function popup(p){let c=p.kind==='trap'?DATA.traps.find(x=>String(x.id)===String(p.id)):DATA.monitoring.find(x=>String(x.id)===String(p.id));if(!c)return;let lat=+c.lat,lon=+c.lon;let el=document.createElement('div');el.className='popup';el.innerHTML=`<h3>${esc(c.title||c.name||c.id)}</h3><p><b>Type:</b> ${esc(c.type||'')}</p><p><b>Line:</b> ${esc(c.line||'—')}</p><p><b>GPS:</b> ${lat.toFixed(6)}, ${lon.toFixed(6)}</p><button class="nav" onclick="location.href='https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}'">Navigate</button>`;new maplibregl.Popup().setLngLat([lon,lat]).setDOMContent(el).addTo(map)}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='kpJsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2);let done=false;const script=document.createElement('script');const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove()};const timer=setTimeout(()=>{cleanup();reject(new Error('Trap.NZ JSONP request timed out'))},30000);window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Trap.NZ JSONP request failed'))};script.src=url+(url.includes('?')?'&':'?')+'format_options='+encodeURIComponent('callback:'+cb);document.head.appendChild(script)})}
async function sync(){let key=prompt('Enter your Trap.NZ read-only map-feed API key.',localStorage.getItem('kp_trapnz_key')||'');if(!key)return;let project=prompt('Enter your Trap.NZ project ID.',localStorage.getItem('kp_trapnz_project')||'');if(!project||!/^[0-9]+$/.test(project.trim()))return alert('Valid numeric project ID required.');localStorage.setItem('kp_trapnz_key',key.trim());localStorage.setItem('kp_trapnz_project',project.trim());let base=`https://io.trap.nz/geo/trapnz-projects/wfs/${encodeURIComponent(key.trim())}/${encodeURIComponent(project.trim())}`;$('status').textContent='Syncing Trap.NZ — read-only…';try{async function all(type){let out=[];for(let start=0;;start+=5000){let u=base+`?service=WFS&version=1.0.0&request=GetFeature&typeName=${encodeURIComponent(type)}&outputFormat=text/javascript&maxFeatures=5000&startIndex=${start}`;let g=await jsonp(u);let f=Array.isArray(g?.features)?g.features:[];out.push(...f);if(f.length<5000)break;if(start>200000)throw Error(type+' exceeded safety limit')}return out}function coords(g){if(!g)return null;if(g.type==='Point'&&Array.isArray(g.coordinates))return g.coordinates;if(g.type==='MultiPoint'&&Array.isArray(g.coordinates)&&g.coordinates[0])return g.coordinates[0];return null}let[tf,mf,lf]=await Promise.all([all('trapnz-projects:default-project-traps'),all('trapnz-projects:default-project-monitoring-stations'),all('trapnz-projects:default-project-lines')]);DATA.traps=tf.map(f=>{let p=f.properties||{},c=coords(f.geometry);return{id:String(p.trap_id??p.main_trap_id??p.id??p.nid??''),title:String(p.trap_code??p.code??p.title??p.name??p.trap_id??'Trap'),line:String(p.line??p.line_name??''),type:String(p.trap_type??p.type??'Trap'),lat:+(c?.[1]),lon:+(c?.[0])}}).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon));DATA.monitoring=mf.map(f=>{let p=f.properties||{},c=coords(f.geometry);return{id:String(p.nid??p.id??p.number??p.code??''),name:String(p.name??p.code??p.number??p.nid??''),code:String(p.code??''),line:String(p.line??p.line_name??''),type:String(p.monitoring_type??p.type??'Monitoring'),lat:+(c?.[1]),lon:+(c?.[0])}}).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon));DATA.lines=[];lf.forEach(f=>{let p=f.properties||{},g=f.geometry||{},parts=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];parts.forEach(c=>{if(c&&c.length>1)DATA.lines.push({name:String(p.line??p.line_name??p.name??p.title??('Line '+(DATA.lines.length+1))),points:c.map(x=>[+x[0],+x[1]])})})});save();selectedLine='';update();map.fitBounds(bounds(),{padding:40});$('status').textContent=`Trap.NZ sync complete — ${DATA.traps.length.toLocaleString()} traps • ${DATA.monitoring.length.toLocaleString()} monitoring • ${DATA.lines.length.toLocaleString()} lines. READ-ONLY.`;alert($('status').textContent)}catch(e){console.error(e);$('status').textContent='Sync failed — existing local data was kept.';alert('Sync failed: '+e.message)}}
function setBase(t){localStorage.setItem('kp_base',t);map.setStyle(style(t));map.once('style.load',()=>{layers();map.fitBounds(bounds(),{padding:40})})}
map=new maplibregl.Map({container:'map',style:style(localStorage.getItem('kp_base')||'street'),center:[177.04,-37.99],zoom:11.5});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('load',()=>{layers();map.fitBounds(bounds(),{padding:40})});map.on('click','traps',e=>popup(e.features[0].properties));map.on('click','mon',e=>popup(e.features[0].properties));map.on('click','lines',e=>{$('line').value=e.features[0].properties.name;update()});
$('filterBtn').onclick=()=>$('drawer').classList.add('open');$('close').onclick=()=>$('drawer').classList.remove('open');$('syncBtn').onclick=sync;$('sync2').onclick=sync;$('zin').onclick=()=>map.zoomIn();$('zout').onclick=()=>map.zoomOut();$('searchBtn').onclick=()=>{$('drawer').classList.add('open');$('search').focus()};$('centre').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:16}));$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:16}));$('linesTab').onclick=()=>{$('showLines').checked=!$('showLines').checked;update()};$('add').onclick=()=>alert('Add tools will be added after the map is stable.');['showTraps','showMon','showLines','line','trapType','monType','search'].forEach(id=>$(id).addEventListener('input',update));document.querySelectorAll('input[name=base]').forEach(r=>r.onchange=()=>setBase(r.value));$('linzKey').value=localStorage.getItem('kp_linz_key')||'';$('saveKey').onclick=()=>{let k=$('linzKey').value.trim();if(!k)return alert('Paste your LINZ key first.');localStorage.setItem('kp_linz_key',k);let t=document.querySelector('input[name=base]:checked').value;setBase(t);$('mapStatus').textContent='LINZ key saved on this phone.'};
</script>
</body>
</html>
