<div class="drawer" id="drawer"><button class="close" id="close">×</button><h2>Map filters</h2><div class="hint">Trap.NZ data is read-only here. Nothing is written back to Trap.NZ.</div>
<div class="section"><b>Layers</b><label><input id="showTraps" type="checkbox" checked> Traps</label><label><input id="showMon" type="checkbox" checked> Monitoring</label><label><input id="showLines" type="checkbox" checked> Trap lines</label><label><input id="showNumbers" type="checkbox" checked> Trap numbers</label><label><input id="showLineNames" type="checkbox" checked> Line names</label><label><input id="showMonNames" type="checkbox" checked> Monitoring names</label></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const DATA={traps:[],monitoring:[],lines:[],records:[],baitStations:[]};let map,baseLayer,trapLayer=L.layerGroup(),monLayer=L.layerGroup(),lineLayer=L.layerGroup(),labelLayer=L.layerGroup(),bound=false;const $=id=>document.getElementById(id),DB='kaitiaki_pest_db_v4';
function field(o,keys,def=''){for(const k of keys){let v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return def}
function text(v){if(v&&typeof v==='object')return field(v,['name','title','code','username','id'],JSON.stringify(v));return String(v??'')}
function esc(v){return text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('en-NZ',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function trapCode(t){return text(field(t,['title','name','trap_code','code','trap_number','number','id'],''))}
function trapKey(t){return text(field(t,['id','nid','trap_id','main_trap_id','uuid'],''))}
function recordKeys(r){return ['trap_code','trapCode','trap_name','trapName','trap_id','trapId','trap_nid','trapNid','trap_node_id','main_trap_id','mainTrapId'].map(k=>text(r?.[k]).trim().toLowerCase()).filter(Boolean)}
function recordDate(r){return field(r,['record_date','recordDate','date','created_at','created'],'')}
function recSpecies(r){return text(field(r,['species_caught','speciesCaught','species','catch_species','catch'],'')).trim()}
function isCatch(r){const s=recSpecies(r).toLowerCase();return !!s&&s!=='none'&&s!=='no catch'&&s!=='null'}
function recordsFor(t){const ids=[trapCode(t),trapKey(t),text(t.name),text(t.code),text(t.trap_code),text(t.trap_number),text(t.number)].filter(Boolean).map(x=>x.trim().toLowerCase());return DATA.records.filter(r=>recordKeys(r).some(k=>ids.includes(k))).sort((a,b)=>new Date(recordDate(b))-new Date(recordDate(a)))}
function catchCount(r){const n=Number(field(r,['number_caught','numberCaught','count_caught','count','quantity'],''));return Number.isFinite(n)&&n>0?n:1}
function statsFor(t){const rows=recordsFor(t),by={};for(const r of rows)if(isCatch(r)){const s=recSpecies(r)||'Unknown';by[s]=(by[s]||0)+catchCount(r)}return{rows,by,possums:rows.filter(r=>recSpecies(r).toLowerCase().includes('possum')).reduce((a,r)=>a+catchCount(r),0)}}
function bounds(){const p=[];DATA.traps.forEach(t=>p.push([+t.lat,+t.lon]));DATA.monitoring.forEach(t=>p.push([+t.lat,+t.lon]));DATA.baitStations.forEach(t=>p.push([+t.lat,+t.lon]));DATA.lines.forEach(l=>(l.points||[]).forEach(x=>p.push([+x[1],+x[0]])));const a=p.filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));return a.length?L.latLngBounds(a):L.latLngBounds([[-38.02,177],[-37.97,177.08])}
function street(){return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'})}
function makeBase(type){const k=localStorage.getItem('kp_linz_key')||'';if(type==='satellite'&&k)return L.tileLayer('https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api='+encodeURIComponent(k),{maxZoom:22,attribution:'© LINZ'});if(type==='topo'&&k)return L.tileLayer('https://basemaps.linz.govt.nz/v1/tiles/topographic/WebMercatorQuad/{z}/{x}/{y}.webp?api='+encodeURIComponent(k),{maxZoom:22,attribution:'© LINZ'});return street()}
function setBase(type){if(baseLayer)map.removeLayer(baseLayer);baseLayer=makeBase(type);baseLayer.on('tileerror',()=>{$('mapStatus').textContent='Basemap tiles failed — check your LINZ key/network.'});baseLayer.addTo(map);localStorage.setItem('kp_basemap',type);setTimeout(()=>map.invalidateSize(),100)}
function icon(cls){return L.divIcon({className:'',html:'<div class="'+cls+'"></div>',iconSize:[18,18],iconAnchor:[9,9]})}
function filters(){return{line:$('line').value,trapType:$('trapType').value,monType:$('monType').value,search:$('search').value.trim().toLowerCase()}}
function pass(t,f,mon=false){if(f.line&&t.line!==f.line)return false;if(f[mon?'monType':'trapType']&&t.type!==f[mon?'monType':'trapType'])return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().includes(f.search)}
function showTrap(t){const s=statsFor(t),rows=s.rows;let details='<div class="detail"><b>Trap number:</b><span>'+esc(trapCode(t))+'</span></div><div class="detail"><b>Type:</b><span>'+esc(t.type||'—')+'</span></div><div class="detail"><b>Line:</b><span>'+esc(t.line||'—')+'</span></div><div class="detail"><b>GPS:</b><span>'+(+t.lat).toFixed(6)+', '+(+t.lon).toFixed(6)+'</span></div><div class="detail"><b>Installed:</b><span>'+esc(t.installed||'—')+'</span></div><div class="detail"><b>Installed By:</b><span>'+esc(t.installedBy||'—')+'</span></div><div class="detail"><b>Sensor provider:</b><span>'+esc(t.sensorProvider||'—')+'</span></div><div class="detail"><b>Sensor ID:</b><span>'+esc(t.sensorId||'—')+'</span></div><div class="detail"><b>Retired:</b><span>'+esc(t.retired||'0')+'</span></div><div class="detail"><b>Notes:</b><span>'+esc(t.notes||'—')+'</span></div>';const catches=Object.entries(s.by).map(([k,v])=>'<div class="stat"><b>'+v.toLocaleString()+'</b>'+esc(k)+' catches</div>').join('')||'<div class="stat"><b>0</b>Total catches</div>';const hist=rows.length?rows.map(r=>'<div class="historyrow"><strong>'+esc(fmtDate(recordDate(r)))+'</strong><span>Catch: '+esc(recSpecies(r)||'None')+'</span><span>Status: '+esc(field(r,['trap_status','trapStatus','status'],'—'))+'</span><span>Condition: '+esc(field(r,['trap_condition','trapCondition','condition'],'—'))+'</span><span>Re-baited: '+esc(field(r,['rebaited'],'—'))+'</span><span>Recorded by: '+esc(field(r,['recorded_by','recordedBy','operator','user_name','username'],'—'))+'</span></div>').join(''):'<div class="hint">No monitoring records found for this trap.</div>';const nav='https://www.google.com/maps/dir/?api=1&destination='+t.lat+','+t.lon;L.popup({maxWidth:460}).setLatLng([+t.lat,+t.lon]).setContent('<div class="popupbox"><h3>'+esc(trapCode(t))+'</h3><div class="details">'+details+'</div><div class="summary"><div class="stat"><b>'+s.possums.toLocaleString()+'</b>Possum catches</div>'+catches+'</div><div class="history"><h4>Monitoring history ('+rows.length+')</h4>'+hist+'</div><a class="nav" target="_blank" rel="noopener" href="'+nav+'">Navigate</a></div>').openOn(map)}
function showMon(m){L.popup().setLatLng([+m.lat,+m.lon]).setContent('<div class="popupbox"><h3>'+esc(field(m,['name','code','number','id'],'Monitoring'))+'</h3><div class="details"><div class="detail"><b>Type:</b><span>'+esc(m.type||'Monitoring')+'</span></div><div class="detail"><b>Line:</b><span>'+esc(m.line||'—')+'</span></div><div class="detail"><b>GPS:</b><span>'+m.lat.toFixed(6)+', '+m.lon.toFixed(6)+'</span></div><div class="detail"><b>Installed:</b><span>'+esc(m.installed||'—')+'</span></div><div class="detail"><b>Installed By:</b><span>'+esc(m.installedBy||'—')+'</span></div><div class="detail"><b>Notes:</b><span>'+esc(m.notes||'—')+'</span></div></div></div>').openOn(map)}
function render(){trapLayer.clearLayers();monLayer.clearLayers();lineLayer.clearLayers();labelLayer.clearLayers();const f=filters();if($('showLines').checked)DATA.lines.forEach(l=>{if(f.line&&l.name!==f.line)return;const pl=L.polyline(l.points.map(x=>[x[1],x[0]]),{color:l.colour||'#2563eb',weight:4,opacity:.9});pl.on('click',()=>{$('line').value=l.name;update()});lineLayer.addLayer(pl);if($('showLineNames').checked&&l.points?.length>1){const mid=l.points[Math.floor(l.points.length/2)];labelLayer.addLayer(L.marker([mid[1],mid[0]],{icon:L.divIcon({className:'label',html:esc(l.name),iconSize:null,iconAnchor:[0,0]}),interactive:false}))}});if($('showTraps').checked)DATA.traps.forEach(t=>{if(!pass(t,f))return;const m=L.marker([+t.lat,+t.lon],{icon:icon('trap-marker'+(trapKey(t)===String(window.selectedTrap||'')?' selected':''))});m.on('click',()=>{window.selectedTrap=trapKey(t);showTrap(t);render()});trapLayer.addLayer(m);if($('showNumbers').checked){labelLayer.addLayer(L.marker([+t.lat,+t.lon],{icon:L.divIcon({className:'label',html:esc(trapCode(t)),iconSize:null,iconAnchor:[12,-8]}),interactive:false}))}});if($('showMon').checked)DATA.monitoring.forEach(m=>{if(!pass(m,f,true))return;const mk=L.marker([+m.lat,+m.lon],{icon:icon('mon-marker')});mk.on('click',()=>showMon(m));monLayer.addLayer(mk);if($('showMonNames').checked)labelLayer.addLayer(L.marker([+m.lat,+m.lon],{icon:L.divIcon({className:'label',html:esc(field(m,['name','code','number','id'],'')),iconSize:null,iconAnchor:[12,-8]}),interactive:false}))});lineLayer.addTo(map);trapLayer.addTo(map);monLayer.addTo(map);labelLayer.addTo(map);$('counts').textContent=DATA.traps.length.toLocaleString()+' traps • '+DATA.monitoring.length.toLocaleString()+' monitoring • '+DATA.lines.length.toLocaleString()}
function update(){render();populate();$('status').textContent=selectedLine()?DATA.traps.filter(t=>t.line===selectedLine()).length+' traps on '+selectedLine():(DATA.traps.length?'Trap.NZ data loaded — '+DATA.traps.length.toLocaleString()+' traps':'Map ready — sync Trap.NZ to load your project.')}
function selectedLine(){return $('line').value}
function populate(){const names=[...new Set([...DATA.lines.map(x=>x.name),...DATA.traps.map(x=>x.line),...DATA.monitoring.map(x=>x.line)].filter(Boolean))].sort((a,b)=>a.localeCompare(b)),l=$('line'),old=l.value;l.innerHTML='<option value="">All lines</option>';names.forEach(x=>l.append(new Option(x,x)));if(names.includes(old))l.value=old;[['trapType',DATA.traps.map(x=>x.type),'trap types'],['monType',DATA.monitoring.map(x=>x.type),'monitoring types']].forEach(([id,vals,txt])=>{const el=$(id),o=el.value;el.innerHTML='<option value="">All '+txt+'</option>';[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(x=>el.append(new Option(x,x)));if([...el.options].some(x=>x.value===o))el.value=o})}
async function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function saveData(){try{const d=await db(),tx=d.transaction('data','readwrite'),s=tx.objectStore('data');Object.keys(DATA).forEach(k=>s.put(DATA[k],k));tx.oncomplete=()=>d.close()}catch(e){console.error(e)}}async function loadData(){try{const d=await db(),tx=d.transaction('data','readonly'),s=tx.objectStore('data');for(const k of Object.keys(DATA)){const v=await new Promise((res,rej)=>{const q=s.get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(Array.isArray(v))DATA[k]=v}d.close()}catch(e){console.error(e)}}
async function syncTrapNZ(){const oldKey=localStorage.getItem('kp_trapnz_key')||'',oldProject=localStorage.getItem('kp_trapnz_project')||'',key=prompt('Enter your Trap.NZ map-feed API key. Read-only only.',oldKey);if(!key)return;const project=prompt('Enter your Trap.NZ project ID.',oldProject);if(!project||!/^[0-9]+$/.test(project.trim()))return alert('Valid Trap.NZ project ID required.');localStorage.setItem('kp_trapnz_key',key.trim());localStorage.setItem('kp_trapnz_project',project.trim());const base='https://io.trap.nz/geo/trapnz-projects/wfs/'+encodeURIComponent(key.trim())+'/'+encodeURIComponent(project.trim());$('status').textContent='Syncing Trap.NZ — read-only…';try{async function page(type,start=0){const u=base+'?service=WFS&version=1.1.0&request=GetFeature&typeName='+encodeURIComponent(type)+'&outputFormat=application/json&count=5000&startIndex='+start;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(type+': HTTP '+r.status);return r.json()}async function all(type){const out=[];for(let i=0;;i+=5000){const g=await page(type,i),fs=Array.isArray(g.features)?g.features:[];out.push(...fs);if(fs.length<5000)break}return out}const [tr,mo,li,ba,re]=await Promise.all([all('trapnz-projects:default-project-traps'),all('trapnz-projects:default-project-monitoring-stations'),all('trapnz-projects:default-project-lines'),all('trapnz-projects:default-project-bait-stations'),all('trapnz-projects:default-project-trap-records')]);DATA.traps=tr.map(f=>{const p=f.properties||{},c=f.geometry?.coordinates||[];return{id:text(field(p,['nid','id','trap_id','main_trap_id','uuid'],'')),title:text(field(p,['name','trap_code','code','title','trap_number','number','id'],'Trap')),name:text(field(p,['name'],'')),code:text(field(p,['code'],'')),trap_code:text(field(p,['trap_code'],'')),line:text(field(p,['line','line_name'],'')),type:text(field(p,['trap_type','type'],'Trap')),lat:+c[1],lon:+c[0],installed:field(p,['date_installed','installed_date','installation_date']),instal
