ding:13px;border:0;border-radius:10px;background:#0d594b;color:#fff;font-weight:800}.danger{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;background:#fff}.popupbox{max-width:min(430px,88vw);max-height:72vh;overflow:auto;border-radius:10px;padding:15px}.popupbox h3{margin:0 0 12px;font-size:22px}.popupbox p{margin:5px 0;font-size:13px}.detail{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:7px 0;font-size:13px;line-height:1.3}.details{border-top:1px solid #ddd;padding-top:9px;margin-top:8px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{border:1px solid #ddd;border-radius:9px;padding:9px}.stat b{display:block;font-size:20px}.history{border-top:1px solid #ddd;margin-top:10px;padding-top:9px}.history h4{margin:0 0 5px}.historyrow{padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.historyrow strong{display:block;font-size:13px;margin-bottom:3px}.historyrow span{display:block;margin:2px 0}.nav{display:inline-block;margin-top:10px;border:0;border-radius:9px;padding:10px 13px;background:#0d594b;color:#fff;text-decoration:none;font-weight:700}.maplibregl-popup-content{padding:0!important;background:transparent!important;box-shadow:none!important}.maplibregl-popup-tip{display:none}.maplibregl-popup-close-button{z-index:2;font-size:22px;padding:5px}.maplibregl-ctrl-attrib{font-size:9px}

<div class="top"><div class="pill" id="counts">0 traps • 0 monitoring • 0 lines</div><div class="actions"><button class="btn" id="filterBtn">☰</button><button class="btn" id="syncBtn">↻</button><button class="btn" id="menuBtn">☰</button></div></div>

<div class="drawer" id="drawer"><button class="close" id="close">×</button><h2>Map filters</h2><div class="hint">Trap.NZ data is read-only here. Nothing is written back to Trap.NZ.</div>
<div class="section"><b>Layers</b><label><input id="showTraps" type="checkbox" checked> Traps</label><label><input id="showMon" type="checkbox" checked> Monitoring</label><label><input id="showLines" type="checkbox" checked> Trap lines</label><label><input id="showNumbers" type="checkbox" checked> Trap numbers</label><label><input id="showLineNames" type="checkbox" checked> Line names</label><label><input id="showMonNames" type="checkbox" checked> Monitoring names</label></div>

<script>
const DATA={traps:[],monitoring:[],lines:[],records:[],baitStations:[]};
let map=null,selected={line:'',trap:''},mapReady=false,eventsBound=false;
const $=id=>document.getElementById(id);
const DB='kaitiaki_pest_db_v2';
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveData(){try{const d=await db(),tx=d.transaction('data','readwrite'),s=tx.objectStore('data');for(const k of Object.keys(DATA))s.put(DATA[k],k);await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)});d.close()}catch(e){console.error(e)}}
async function loadData(){try{const d=await db(),tx=d.transaction('data','readonly'),s=tx.objectStore('data');const get=k=>new Promise((r,j)=>{const q=s.get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});for(const k of Object.keys(DATA)){const v=await get(k);if(Array.isArray(v))DATA[k]=v}d.close()}catch(e){console.error(e)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('en-NZ',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function field(p,keys,def=''){for(const k of keys)if(p&&p[k]!==undefined&&p[k]!==null&&String(p[k]).trim()!=='')return p[k];return def}
function trapCode(t){return String(field(t,['title','code','trap_code','name','id'],''))}
function recordTrapCode(r){return String(field(r,['trap_code','trap_code_name','trap_name','trap','trap_id','trap_nid','id_trap'],''))}
function isCatch(r){const s=String(field(r,['species_caught','species','catch_species'],'')).trim();return s!==''&&s.toLowerCase()!=='none'&&s.toLowerCase()!=='no catch'}
function species(r){return String(field(r,['species_caught','species','catch_species'],'')).trim()}
function recordsFor(t){const code=trapCode(t).trim().toLowerCase();const id=String(field(t,['id','trap_id','nid'],'')).trim().toLowerCase();return DATA.records.filter(r=>{const rc=recordTrapCode(r).trim().toLowerCase();return rc===code||(id&&rc===id)}).sort((a,b)=>new Date(field(b,['record_date','date','created'],'0'))-new Date(field(a,['record_date','date','created'],'0')))}
function statsFor(t){const rows=recordsFor(t),by={};for(const r of rows){if(isCatch(r)){const sp=species(r)||'Unknown';by[sp]=(by[sp]||0)+1}}return{rows,by,total:Object.values(by).reduce((a,b)=>a+b,0)}}
function bounds(){const pts=[];DATA.traps.forEach(t=>pts.push([+t.lon,+t.lat]));DATA.monitoring.forEach(t=>pts.push([+t.lon,+t.lat]));DATA.baitStations.forEach(t=>pts.push([+t.lon,+t.lat]));DATA.lines.forEach(l=>(l.points||[]).forEach(p=>pts.push(p)));const p=pts.filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));if(!p.length)return [[177,-38.02],[177.08,-37.97]];let xs=p.map(x=>x[0]),ys=p.map(x=>x[1]),pad=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*.04||.001;return [[Math.min(...xs)-pad,Math.min(...ys)-pad],[Math.max(...xs)+pad,Math.max(...ys)+pad]]}
function osm(){return{version:8,sources:{base:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'base',type:'raster',source:'base'}]}}
function mapStyle(type){const k=localStorage.getItem('kp_linz_key')||'';if(type==='satellite'&&k)return{version:8,sources:{base:{type:'raster',tiles:[`https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api=${encodeURIComponent(k)}`],tileSize:256,attribution:'© LINZ'}},layers:[{id:'base',type:'raster',source:'base'}]};if(type==='topo'&&k)return`https://basemaps.linz.govt.nz/v1/styles/topographic-v2.json?api=${encodeURIComponent(k)}`;return osm()}
function filters(){return{line:$('line').value,trapType:$('trapType').value,monType:$('monType').value,search:$('search').value.trim().toLowerCase()}}
function passesTrap(t,f){if(f.line&&t.line!==f.line)return false;if(f.trapType&&t.type!==f.trapType)return false;return !f.search||[t.id,t.title,t.line,t.type].join(' ').toLowerCase().includes(f.search)}
function passesMon(t,f){if(f.line&&t.line!==f.line)return false;if(f.monType&&t.type!==f.monType)return false;return !f.search||[t.id,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().includes(f.search)}
function geo(){
 const f=filters(),features=[];
 if($('showLines').checked){
  DATA.lines.forEach(l=>{if(f.line&&l.name!==f.line)return;features.push({type:'Feature',geometry:{type:'LineString',coordinates:l.points},properties:{kind:'line',name:String(l.name||''),colour:l.colour||'#2563eb'}})});
 }
 if($('showTraps').checked){
  DATA.traps.forEach(t=>{if(!passesTrap(t,f))return;features.push({type:'Feature',geometry:{type:'Point',coordinates:[+t.lon,+t.lat]},properties:{kind:'trap',id:String(field(t,['id','trap_id','nid'],'')),name:trapCode(t),selected:String(field(t,['id','trap_id','nid'],''))===String(selected.trap)?'1':'0'}})});
 }
 if($('showMon').checked){
  DATA.monitoring.forEach(m=>{if(!passesMon(m,f))return;features.push({type:'Feature',geometry:{type:'Point',coordinates:[+m.lon,+m.lat]},properties:{kind:'monitoring',id:String(field(m,['id','nid','number'],'')),name:String(field(m,['name','code','number','numberCode','number_code','id'],'')),type:String(m.type||'Monitoring'),glyph:monitorGlyph(m.type)}})});
 }
 return {type:'FeatureCollection',features};
}
function monitorGlyph(t){const s=String(t||'').toLowerCase();return s.includes('camera')?'📷':(s.includes('wax')||s.includes('tag'))?'🟨':s.includes('bird')?'🐦':(s.includes('tracking')||s.includes('tunnel'))?'🐾':s.includes('chew')?'🟫':s.includes('sensor')?'📡':'📍'}
function ensureLayers(){if(!map||!map.isStyleLoaded())return;const data=geo();if(map.getSource('kp-data'))map.getSource('kp-data').setData(data);else map.addSource('kp-data',{type:'geojson',data});const add=(id,l)=>{if(!map.getLayer(id))map.addLayer(l)};add('kp-lines',{id:'kp-lines',type:'line',source:'kp-data',filter:['==',['get','kind'],'line'],paint:{'line-color':['coalesce',['get','colour'],'#2563eb'],'line-width':4,'line-opacity':.9}});add('kp-traps',{id:'kp-traps',type:'circle',source:'kp-data',filter:['==',['get','kind'],'trap'],paint:{'circle-radius':6,'circle-color':['case',['==',['get','selected'],'1'],'#dc2626','#16803c'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});add('kp-mon',{id:'kp-mon',type:'circle',source:'kp-data',filter:['==',['get','kind'],'monitoring'],paint:{'circle-radius':6,'circle-color':'#f59e0b','circle-stroke-color':'#fff','circle-stroke-width':1.5}});add('kp-labels',{id:'kp-labels',type:'symbol',source:'kp-data',filter:['in',['get','kind'],['literal',['trap','monitoring']]],layout:{'text-field':['get','name'],'text-size':11,'text-offset':[.75,.75],'text-anchor':'left','text-allow-overlap':false},paint:{'text-color':'#17202a','text-halo-color':'#fff','text-halo-width':1.7}});add('kp-mon-icons',{id:'kp-mon-icons',type:'symbol',source:'kp-data',filter:['==',['get','kind'],'monitoring'],layout:{'text-field':['get','glyph'],'text-size':16,'text-allow-overlap':true},paint:{'text-halo-color':'#fff','text-halo-width':1}});add('kp-line-labels',{id:'kp-line-labels',type:'symbol',source:'kp-data',filter:['==',['get','kind'],'line'],layout:{'symbol-placement':'line','text-field':['get','name'],'text-size':11,'text-allow-overlap':false},paint:{'text-color':'#17202a','text-halo-color':'#fff','text-halo-width':2}});updateVisibility();bindEvents()}
function updateVisibility(){if(!map)return;const v=(id,on)=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none');v('kp-lines',$('showLines').checked);v('kp-traps',$('showTraps').checked);v('kp-mon',$('showMon').checked);v('kp-labels',$('showNumbers').checked||$('showMonNames').checked);v('kp-line-labels',$('showLineNames').checked&&$('showLines').checked);v('kp-mon-icons',$('showMon').checked)}
function updateMap(){if(!mapReady)return;const s=map.getSource('kp-data');if(s)s.setData(geo());updateVisibility();$('counts').textContent=`${DATA.traps.length.toLocaleString()} traps • ${DATA.monitoring.length.toLocaleString()} monitoring • ${DATA.lines.length.toLocaleString()} lines`;populate();$('status').textContent=selected.line?`${DATA.traps.filter(t=>t.line===selected.line).length} traps on ${selected.line}`:'Map ready — Trap.NZ data loaded.'}
function bindEvents(){if(eventsBound)return;eventsBound=true;map.on('click','kp-traps',e=>{const p=e.features?.[0]?.properties;if(!p)return;const t=DATA.traps.find(x=>String(field(x,['id','trap_id','nid'],''))===String(p.id));if(t){selected.trap=String(p.id);showTrap(t);updateMap()}});map.on('click','kp-labels',e=>{const p=e.features?.[0]?.properties;if(!p)return;if(p.kind==='trap'){const t=DATA.traps.find(x=>String(field(x,['id','trap_id','nid'],''))===String(p.id));if(t)showTrap(t)}else{const m=DATA.monitoring.find(x=>String(field(x,['id','nid','number'],''))===String(p.id));if(m)showMon(m)}});map.on('click','kp-mon',e=>{const p=e.features?.[0]?.properties;if(!p)return;const m=DATA.monitoring.find(x=>String(field(x,['id','nid','number'],''))===String(p.id));if(m)showMon(m)});map.on('click','kp-lines',e=>{const p=e.features?.[0]?.properties;if(p?.name){selected.line=String(p.name);$('line').value=selected.line;updateMap()}});['kp-traps','kp-mon','kp-lines'].forEach(id=>{map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='')})}
function popup(html,lngLat){new maplibregl.Popup({closeButton:true,closeOnClick:true,maxWidth:'460px',offset:12}).setLngLat(lngLat).setHTML(`<div class="popupbox">${html}</div>`).addTo(map)}
function showTrap(t){const s=statsFor(t),rows=s.rows;const project=field(t,['project','project_name'],'Korehāhā Whakahau'),pid=field(t,['project_id','project_nid'],'');const catchLines=Object.entries(s.by).map(([k,v])=>`<div class="stat"><b>${v}</b>${esc(k)} catches</div>`).join('')||'<div class="stat"><b>0</b>catches</div>';const hist=rows.length?rows.slice(0,50).map(r=>`<div class="historyrow"><strong>${esc(fmtDate(field(r,['record_date','date','created'],'')))}</strong><span>Catch: ${esc(species(r)||'None')}</span><span>Status: ${esc(field(r,['trap_status','status'],'—'))}</span><span>Condition: ${esc(field(r,['trap_condition','condition'],'—'))}</span><span>Strikes: ${esc(field(r,['strikes'],'0'))}</span>${field(r,['recorded_by'])?`<span>Recorded by: ${esc(field(r,['recorded_by']))}</span>`:''}${field(r,['bait_at_departure','bait_details_at_departure'])?`<span>Bait: ${esc(field(r,['bait_at_departure','bait_details_at_departure']))}</span>`:''}${field(r,['record_notes','notes'])?`<span>Notes: ${esc(field(r,['record_notes','notes']))}</span>`:''}</div>`).join(''):'<p class="hint">No monitoring records found for this trap.</p>';const rowsHtml=[['Type',field(t,['type','trap_type'],'—')],['Line',field(t,['line'],'—')],['GPS',`${Number(t.lat).toFixed(6)}, ${Number(t.lon).toFixed(6)}`],['Installed',field(t,['installed','date_installed','date_install'],'—')],['Installed By',field(t,['installedBy','installed_by'],'—')],['Retired',field(t,['retired','is_retired'],'0')],['Notes',field(t,['notes'],'—')],['Last Record Date',rows.length?field(rows[0],['record_date','date'],'—'):'—'],['Project',project],['Project Id',pid],['Sort Order',field(t,['sort_order','sortOrder'],'0')]];const details=rowsHtml.map(([a,b])=>`<div class="detail"><b>${a}:</b><span>${esc(b)}</span></div>`).join('');const nav=`https://www.google.com/maps/dir/?api=1&destination=${Number(t.lat)},${Number(t.lon)}`;popup(`<h3>${esc(trapCode(t))}</h3><div class="details">${details}</div><div class="summary">${catchLines}</div><div class="history"><h4>Monitoring history (${rows.length})</h4>${hist}</div><a class="nav" target="_blank" rel="noopener" href="${nav}">Navigate</a>`,[+t.lon,+t.lat])}
function showMon(m){popup(`<h3>${esc(field(m,['name','code','number','id'],'Monitoring'))}</h3><div class="details"><div class="detail"><b>Type:</b><span>${esc(m.type||'Monitoring')}</span></div><div class="detail"><b>Line:</b><span>${esc(m.line||'—')}</span></div><div class="detail"><b>GPS:</b><span>${Number(m.lat).toFixed(6)}, ${Number(m.lon).toFixed(6)}</span></div><div class="detail"><b>Notes:</b><span>${esc(m.notes||'—')}</span></div></div>`,[+m.lon,+m.lat])}
function populate(){const names=[...new Set([...DATA.lines.map(x=>x.name),...DATA.traps.map(x=>x.line),...DATA.monitoring.map(x=>x.line)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));const l=$('line'),old=l.value;l.innerHTML='<option value="">All lines</option>';names.forEach(x=>l.append(new Option(x,x)));if(names.includes(old))l.value=old;const fill=(id,vals)=>{const el=$(id),o=el.value;el.innerHTML='<option value="">All '+(id==='trapType'?'trap types':'monitoring types')+'</option>';[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(x=>el.append(new Option(x,x)));if([...el.options].some(x=>x.value===o))el.value=o};fill('trapType',DATA.traps.map(x=>x.type));fill('monType',DATA.monitoring.map(x=>x.type))}
async function syncTrapNZ(){const oldKey=localStorage.getItem('kp_trapnz_key')||'',oldProject=localStorage.getItem('kp_trapnz_project')||'';const key=prompt('Enter your Trap.NZ map-feed API key. Read-only only.',oldKey);if(!key)return;const project=prompt('Enter your Trap.NZ project ID.',oldProject);if(!project||!/^[0-9]+$/.test(project.trim())){alert('Valid Trap.NZ project ID required.');return}localStorage.setItem('kp_trapnz_key',key.trim());localStorage.setItem('kp_trapnz_project',project.trim());const base=`https://io.trap.nz/geo/trapnz-projects/wfs/${encodeURIComponent(key.trim())}/${encodeURIComponent(project.trim())}`;$('status').textContent='Syncing Trap.NZ — read-only…';try{async function page(typeName,start=0){const u=base+`?service=WFS&version=1.1.0&request=GetFeature&typeName=${encodeURIComponent(typeName)}&outputFormat=application/json&count=5000&startIndex=${start}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${typeName}: HTTP ${r.status}`);return r.json()}async function all(typeName){const out=[];for(let start=0;;start+=5000){const g=await page(typeName,start),fs=Array.isArray(g.features)?g.features:[];out.push(...fs);if(fs.length<5000)break}return out}const [trF,monF,lineF,baitF,recF]=await Promise.all([all('trapnz-projects:default-project-traps'),all('trapnz-projects:default-project-monitoring-stations'),all('trapnz-projects:default-project-lines'),all('trapnz-projects:default-project-bait-stations'),all('trapnz-projects:default-project-trap-records')]);DATA.traps=trF.map(f=>{const p=f.properties||{},g=f.geometry||{},c=g.coordinates||[];return{id:String(field(p,['trap_id','id','nid'],'')),title:String(field(p,['trap_code','code','title','name','trap_id'],'Trap')),line:String(field(p,['line'],'')).trim(),type:String(field(p,['trap_type','type'],'Trap')),lat:+c[1],lon:+c[0],installed:field(p,['date_installed','date_install']),installedBy:field(p,['installed_by']),retired:field(p,['retired','is_retired'],'0'),notes:field(p,['notes']),project:field(p,['project','project_name'],''),project_id:field(p,['project_id','project_nid'],''),sort_order:field(p,['sort_order','sortOrder'],'0'),raw:p}}).filter(t=>Number.isFinite(t.lat)&&Number.isFinite(t.lon));DATA.monitoring=monF.map(f=>{const p=f.properties||{},g=f.geometry||{},c=g.coordinates||[];return{id:String(field(p,['nid','id','number','code'],'')),name:String(field(p,['name','code','number','number_code','nid'],'')),code:String(field(p,['code'],'')),number:String(field(p,['number'],'')),line:String(field(p,['line'],'')),type:String(field(p,['monitoring_type','type','monitoringType'],'Monitoring')),lat:+c[1],lon:+c[0],notes:field(p,['notes']),raw:p}}).filter(t=>Number.isFinite(t.lat)&&Number.isFinite(t.lon));DATA.lines=[];for(const f of lineF){const p=f.properties||{},g=f.geometry||{},parts=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];for(const c of parts)if(c?.length>=2)DATA.lines.push({name:String(field(p,['line','name','title'],`Line ${DATA.lines.length+1}`)),points:c.map(x=>[+x[0],+x[1]]),colour:String(field(p,['colour','color'],'#2563eb'))})}DATA.baitStations=baitF.map(f=>{const p=f.properties||{},g=f.geometry||{},c=g.coordinates||[];return{id:String(field(p,['bait_station_id','id','nid'],'')),name:String(field(p,['code','name','bait_station_code','bait_station_id'],'Bait station')),line:String(field(p,['line'],'')),type:String(field(p,['bait_station_type','type'],'Bait station')),lat:+c[1],lon:+c[0],notes:field(p,['notes'])}}).filter(t=>Number.isFinite(t.lat)&&Number.isFinite(t.lon));DATA.records=recF.map(f=>{const p=f.properties||{};return{...p,raw:p}});if(!DATA.traps.length||!DATA.lines.length)throw new Error(`Trap.NZ returned ${DATA.traps.length} traps and ${DATA.lines.length} lines.`);selected={line:'',trap:''};await saveData();populate();updateMap();map.fitBounds(bounds(),{padding:35});$('status').textContent=`Trap.NZ sync complete — ${DATA.traps.length.toLocaleString()} traps • ${DATA.records.length.toLocaleString()} trap records • ${DATA.monitoring.length.toLocaleString()} monitoring • ${DATA.lines.length.toLocaleString()} lines. READ-ONLY.`;alert(`Trap.NZ sync complete.\n\n${DATA.traps.length.toLocaleString()} traps\n${DATA.records.length.toLocaleString()} trap records\n${DATA.monitoring.length.toLocaleString()} monitoring stations\n${DATA.lines.length.toLocaleString()} lines\n\nNothing was written to Trap.NZ.`)}catch(e){console.error(e);$('status').textContent='Trap.NZ sync failed — existing local data was kept.';alert('Sync failed: '+e.message+'\n\nNo changes were sent to Trap.NZ.')}}
function init(){const base=localStorage.getItem('kp_basemap')||'street';$('linzKey').value=localStorage.getItem('kp_linz_key')||'';document.querySelectorAll('input[name="base"]').forEach(r=>r.checked=r.value===base);map=new maplibregl.Map({container:'map',style:mapStyle(base),center:[177.04,-37.99],zoom:12,attributionControl:true});window.kpMap=map;map.on('load',async()=>{mapReady=true;await loadData();populate();ensureLayers();map.fitBounds(bounds(),{padding:35});if(DATA.traps.length)$('status').textContent=`${DATA.traps.length.toLocaleString()} traps • ${DATA.records.length.toLocaleString()} trap records loaded.`});map.on('style.load',()=>{if(mapReady){ensureLayers();map.fitBounds(bounds(),{padding:35})}});map.on('error',e=>{if([400,401,403,404].includes(e?.error?.status)&&base!=='street'){localStorage.setItem('kp_basemap','street');map.setStyle(osm())}})}
$('filterBtn').onclick=()=>$('drawer').classList.add('open');$('close').onclick=()=>$('drawer').classList.remove('open');$('syncBtn').onclick=syncTrapNZ;$('sync2').onclick=syncTrapNZ;$('zin').onclick=()=>map.zoomIn();$('zout').onclick=()=>map.zoomOut();$('centre').onclick=()=>map.fitBounds(bounds(),{padding:35});$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:Math.max(map.getZoom(),16)}));$('searchBtn').onclick=()=>{$('drawer').classList.add('open');$('search').focus()};['line','trapType','monType','search','showTraps','showMon','showLines','showNumbers','showLineNames','showMonNames'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='line')selected.line=$('line').value;updateMap()}));document.querySelectorAll('input[name="base"]').forEach(r=>r.onchange=()=>{localStorage.setItem('kp_basemap',r.value);map.setStyle(mapStyle(r.value))});$('saveKey').onclick=()=>{localStorage.setItem('kp_linz_key',$('linzKey').value.trim());$('mapStatus').textContent='LINZ key saved on this phone.';const v=document.querySelector('input[name="base"]:checked').value;map.setStyle(mapStyle(v))};init();
