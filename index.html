<script>
(function(){
function loadLeaflet(){return new Promise(function(resolve,reject){if(window.L)return resolve();var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=resolve;s.onerror=function(){var f=document.createElement('script');f.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';f.onload=resolve;f.onerror=reject;document.head.appendChild(f)};document.head.appendChild(s)})}
var DATA={traps:[],monitoring:[],lines:[],records:[],baitStations:[]},map,baseLayer;var trapLayer=LAYER(),monLayer=LAYER(),lineLayer=LAYER(),labelLayer=LAYER();
function LAYER(){return {items:[],addTo:function(m){this.map=m;this.items.forEach(function(x){x.addTo(m)});return this},clearLayers:function(){this.items.forEach(function(x){if(this.map)this.map.removeLayer(x)},this);this.items=[]},addLayer:function(x){this.items.push(x);if(this.map)x.addTo(this.map)}}}
function $(id){return document.getElementById(id)}
function field(o,keys,def){def=def||'';for(var i=0;i<keys.length;i++){var v=o&&o[keys[i]];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return def}
function text(v){if(v&&typeof v==='object')return field(v,['name','title','code','username','id'],JSON.stringify(v));return String(v==null?'':v)}
function esc(v){return text(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function trapCode(t){return text(field(t,['title','name','trap_code','code','trap_number','number','id'],''))}
function trapKey(t){return text(field(t,['id','nid','trap_id','main_trap_id','uuid'],''))}
function recKeys(r){return ['trap_code','trapCode','trap_name','trapName','trap_id','trapId','trap_nid','trapNid','trap_node_id','main_trap_id','mainTrapId'].map(function(k){return text(r&&r[k]).trim().toLowerCase()}).filter(Boolean)}
function recSpecies(r){return text(field(r,['species_caught','speciesCaught','species','catch_species','catch'],'')).trim()}
function recDate(r){return field(r,['record_date','recordDate','date','created_at','created'],'')}
function recordsFor(t){var ids=[trapCode(t),trapKey(t),text(t.name),text(t.code),text(t.trap_code),text(t.trap_number),text(t.number)].filter(Boolean).map(function(x){return x.trim().toLowerCase()});var seen={};return DATA.records.filter(function(r){return recKeys(r).some(function(k){return ids.indexOf(k)>=0})}).filter(function(r){var k=JSON.stringify(r);if(seen[k])return false;seen[k]=1;return true}).sort(function(a,b){return new Date(recDate(b))-new Date(recDate(a))})}
function catchCount(r){var n=Number(field(r,['number_caught','numberCaught','count_caught','count','quantity'],''));return isFinite(n)&&n>0?n:1}
function statsFor(t){var rows=recordsFor(t),by={},poss=0;rows.forEach(function(r){var s=recSpecies(r).toLowerCase();if(s&&s!=='none'&&s!=='no catch'&&s!=='null'){var n=recSpecies(r)||'Unknown';by[n]=(by[n]||0)+catchCount(r);if(s.indexOf('possum')>=0)poss+=catchCount(r)}});return{rows:rows,by:by,possums:poss}}
function bounds(){var p=[];DATA.traps.forEach(function(t){p.push([+t.lat,+t.lon])});DATA.monitoring.forEach(function(t){p.push([+t.lat,+t.lon])});DATA.baitStations.forEach(function(t){p.push([+t.lat,+t.lon])});DATA.lines.forEach(function(l){(l.points||[]).forEach(function(x){p.push([+x[1],+x[0]])})});p=p.filter(function(x){return isFinite(x[0])&&isFinite(x[1])});return p.length?window.L.latLngBounds(p):window.L.latLngBounds([[-38.02,177],[-37.97,177.08]])}
function street(){return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'© OpenStreetMap contributors'})}
function makeBase(type){var k=localStorage.getItem('kp_linz_key')||'';if(type==='satellite'&&k)return L.tileLayer('https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api='+encodeURIComponent(k),{maxZoom:22,attribution:'© LINZ'});if(type==='topo'&&k)return L.tileLayer('https://basemaps.linz.govt.nz/v1/tiles/topographic/WebMercatorQuad/{z}/{x}/{y}.webp?api='+encodeURIComponent(k),{maxZoom:22,attribution:'© LINZ'});return street()}
function setBase(type){if(baseLayer)map.removeLayer(baseLayer);baseLayer=makeBase(type);baseLayer.on('tileerror',function(){$('mapStatus').textContent='Map tiles failed. Try Street or check network.'});baseLayer.addTo(map);localStorage.setItem('kp_basemap',type);setTimeout(function(){map.invalidateSize()},100)}
function icon(cls){return L.divIcon({className:'',html:'<div class="'+cls+'"></div>',iconSize:[18,18],iconAnchor:[9,9]})}
function trapStatus(t){var st=text(field(t,['status','trap_status','trapStatus'],'' )).trim().toLowerCase();var dis=text(field(t,['disabled','is_disabled','isDisabled'],'' )).trim().toLowerCase();var en=text(field(t,['enabled','is_enabled','isEnabled'],'' )).trim().toLowerCase();if(dis==='1'||dis==='true'||dis==='yes'||en==='0'||en==='false'||en==='no'||st==='disabled'||st==='inactive'||st==='deactivated')return 'disabled';if(String(t.retired).toLowerCase()==='1'||String(t.retired).toLowerCase()==='true'||st==='retired')return 'retired';return 'active'}
function filters(){var st=window.KPFilterState||{};return{line:st.line||[],trapType:st.trap||[],monType:st.mon||[],status:st.status&&st.status.length?st.status:['active'],search:$('search').value.trim().toLowerCase()}}
function pass(t,f,mon){var k=mon?'monType':'trapType',vals=f[k]||[];if(vals.length&&vals.indexOf(t.type)<0)return false;if(!mon&&f.status&&f.status.length&&f.status.indexOf(trapStatus(t))<0)return false;if(f.line&&f.line.length&&f.line.indexOf(t.line)<0)return false;return !f.search||[t.id,t.title,t.name,t.code,t.number,t.line,t.type].join(' ').toLowerCase().indexOf(f.search)>=0}
function showTrap(t){var s=statsFor(t),rows=s.rows,details='<div class="detail"><b>Trap number:</b><span>'+esc(trapCode(t))+'</span></div><div class="detail"><b>Type:</b><span>'+esc(t.type||'—')+'</span></div><div class="detail"><b>Line:</b><span>'+esc(t.line||'—')+'</span></div><div class="detail"><b>GPS:</b><span>'+t.lat.toFixed(6)+', '+t.lon.toFixed(6)+'</span></div><div class="detail"><b>Installed:</b><span>'+esc(t.installed||'—')+'</span></div><div class="detail"><b>Installed By:</b><span>'+esc(t.installedBy||'—')+'</span></div><div class="detail"><b>Sensor:</b><span>'+esc(t.sensorProvider||'—')+' '+esc(t.sensorId||'')+'</span></div><div class="detail"><b>Retired:</b><span>'+esc(t.retired||'0')+'</span></div>';var catches=Object.keys(s.by).map(function(k){return'<div class="stat"><b>'+s.by[k].toLocaleString()+'</b>'+esc(k)+' catches</div>'}).join('')||'<div class="stat"><b>0</b>Total catches</div>';var hist=rows.length?rows.map(function(r){return'<div class="historyrow"><strong>'+esc(new Date(recDate(r)).toLocaleString('en-NZ'))+'</strong><span>Catch: '+esc(recSpecies(r)||'None')+'</span><span>Status: '+esc(field(r,['trap_status','trapStatus','status'],'—'))+'</span><span>Condition: '+esc(field(r,['trap_condition','trapCondition','condition'],'—'))+'</span><span>Re-baited: '+esc(field(r,['rebaited'],'—'))+'</span><span>Recorded by: '+esc(field(r,['recorded_by','recordedBy','operator','user_name','username'],'—'))+'</span></div>'}).join(''):'<div class="hint">No monitoring records found for this trap.</div>';var nav='https://www.google.com/maps/dir/?api=1&destination='+t.lat+','+t.lon;L.popup({maxWidth:460}).setLatLng([t.lat,t.lon]).setContent('<div class="popupbox"><h3>'+esc(trapCode(t))+'</h3><div class="details">'+details+'</div><div class="summary"><div class="stat"><b>'+s.possums.toLocaleString()+'</b>Possum catches</div>'+catches+'</div><div class="history"><h4>Monitoring history ('+rows.length+')</h4>'+hist+'</div><a class="nav" target="_blank" rel="noopener" href="'+nav+'">Navigate</a></div>').openOn(map)}
function populate(){var names=[].concat(DATA.lines.map(function(x){return x.name}),DATA.traps.map(function(x){return x.line}),DATA.monitoring.map(function(x){return x.line})).filter(Boolean).filter(function(x,i,a){return a.indexOf(x)===i}).sort(),l=$('line'),old=l.value;l.innerHTML='<option value="">All lines</option>';names.forEach(function(x){l.append(new Option(x,x))});if(names.indexOf(old)>=0)l.value=old;[['trapType',DATA.traps.map(function(x){return x.type}),'trap types'],['monType',DATA.monitoring.map(function(x){return x.type}),'monitoring types']].forEach(function(a){var el=$(a[0]),o=el.value;el.innerHTML='<option value="">All '+a[2]+'</option>';a[1].filter(Boolean).filter(function(x,i,v){return v.indexOf(x)===i}).sort().forEach(function(x){el.append(new Option(x,x))});if([].slice.call(el.options).some(function(x){return x.value===o}))el.value=o})}
function render(){trapLayer.clearLayers();monLayer.clearLayers();lineLayer.clearLayers();labelLayer.clearLayers();var f=filters(),z=map.getZoom(),canvas=L.canvas({padding:.5});if($('showLines').checked)DATA.lines.forEach(function(l){if(f.line&&f.line.length&&f.line.indexOf(l.name)<0)return;var pl=L.polyline(l.points.map(function(x){return[x[1],x[0]]}),{color:l.colour||'#2563eb',weight:4,opacity:.9,renderer:canvas});pl.on('click',function(){$('line').value=l.name;update()});lineLayer.addLayer(pl);if($('showLineNames').checked&&z>=13&&l.points.length>1){var mid=l.points[Math.floor(l.points.length/2)];labelLayer.addLayer(L.marker([mid[1],mid[0]],{icon:L.divIcon({className:'label',html:esc(l.name),iconSize:null,iconAnchor:[0,0]}),interactive:false}))}});if($('showTraps').checked)DATA.traps.forEach(function(t){if(!pass(t,f,false))return;var m=L.circleMarker([t.lat,t.lon],{radius:z>=15?5:4,weight:2,fillOpacity:.9,opacity:1,color:'#fff',fillColor:'#16803c',renderer:canvas});m.on('click',function(){showTrap(t)});trapLayer.addLayer(m);if($('showNumbers').checked&&z>=15)labelLayer.addLayer(L.marker([t.lat,t.lon],{icon:L.divIcon({className:'label',html:esc(trapCode(t)),iconSize:null,iconAnchor:[12,-8]}),interactive:false}))});if($('showMon').checked&&z>=14)DATA.monitoring.forEach(function(m){if(!pass(m,f,true))return;if(z<15)return;var b=map.getBounds();if(!b.contains([m.lat,m.lon]))return;var mk=L.circleMarker([m.lat,m.lon],{radius:4,weight:2,fillOpacity:.9,opacity:1,color:'#fff',fillColor:'#f59e0b',renderer:canvas});mk.on('click',function(){L.popup().setLatLng([m.lat,m.lon]).setContent('<div class="popupbox"><h3>'+esc(field(m,['name','code','number','id'],'Monitoring'))+'</h3><div class="detail"><b>Type:</b><span>'+esc(m.type)+'</span></div><div class="detail"><b>Line:</b><span>'+esc(m.line||'—')+'</span></div><div class="detail"><b>GPS:</b><span>'+m.lat.toFixed(6)+', '+m.lon.toFixed(6)+'</span></div></div>').openOn(map)});monLayer.addLayer(mk);if($('showMonNames').checked&&z>=16)labelLayer.addLayer(L.marker([m.lat,m.lon],{icon:L.divIcon({className:'label',html:esc(field(m,['name','code','number','id'],'')),iconSize:null,iconAnchor:[12,-8]}),interactive:false}))});lineLayer.addTo(map);trapLayer.addTo(map);monLayer.addTo(map);labelLayer.addTo(map);$('counts').textContent=DATA.traps.length.toLocaleString()+' traps • '+DATA.monitoring.length.toLocaleString()+' monitoring • '+DATA.lines.length.toLocaleString()}
function update(){populate();render();if(window.mfBuild)window.mfBuild();$('status').textContent=DATA.traps.length?'Trap.NZ data loaded — '+DATA.traps.length.toLocaleString()+' traps':'Map ready — sync Trap.NZ to load your project.'}
async function db(){return new Promise(function(res,rej){var r=indexedDB.open('kaitiaki_pest_db_v5',1);r.onupgradeneeded=function(){r.result.createObjectStore('data')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}

<script id="modern-filter-js">
(function(){
  function selFor(kind){return document.getElementById(kind==='line'?'line':kind==='trap'?'trapType':'monType')}
  function fire(sel){
    if(!sel)return;
    sel.dispatchEvent(new Event('change',{bubbles:true}));
    sel.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function build(kind,id){
    var box=document.getElementById(id),sel=selFor(kind);
    if(!box||!sel)return;
    var current=sel.value;
    box.innerHTML='';
    Array.prototype.slice.call(sel.options).forEach(function(o){
      if(!o.value)return;
      var row=document.createElement('label'); row.className='mfRow';
      var span=document.createElement('span'); span.textContent=o.text;
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=(current===o.value); cb.dataset.value=o.value;
      cb.addEventListener('change',function(){
        if(cb.checked){
          sel.value=o.value;
          Array.prototype.slice.call(box.querySelectorAll('input')).forEach(function(x){if(x!==cb)x.checked=false});
        }else if(sel.value===o.value){sel.value='';}
        fire(sel);
      });
      row.appendChild(span); row.appendChild(cb); box.appendChild(row);
    });
  }
  window.mfBuild=function(){build('trap','mfTraps');build('line','mfLines');build('mon','mfMons');};
  function syncVisibility(){
    var t=document.getElementById('showTraps'),m=document.getElementById('showMon'),l=document.getElementById('showLines');
    var tt=document.getElementById('mfTrapsToggle');
    if(tt&&t)tt.checked=t.checked;
    if(tt&&t)tt.onchange=function(){t.checked=tt.checked;fire(t);};
    ['mfBait','mfPoi','mfSensor'].forEach(function(id){var x=document.getElementById(id);if(x)x.addEventListener('change',function(){})});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('.mfHead button');
    if(!b)return;
    e.preventDefault();
    var g=b.closest('.mfGroup');
    if(!g)return;
    g.classList.toggle('open');
    b.textContent=g.classList.contains('open')?'Hide types':'Show types';
  });
  document.addEventListener('change',function(e){
    if(e.target.matches('#line,#trapType,#monType'))setTimeout(window.mfBuild,0);
  });
  window.mfBuild(); syncVisibility();
  setTimeout(window.mfBuild,300);setTimeout(window.mfBuild,1200);setTimeout(window.mfBuild,2500);
})();
</script>
